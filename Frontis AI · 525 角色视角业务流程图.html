<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-width: 1440px;
      background: #eef1f6;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .pageHeader {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px 32px;
      background: linear-gradient(135deg, #0f172a 0%, #164e63 58%, #0f766e 100%);
      color: #fff;
      box-shadow: 0 3px 16px rgba(0, 0, 0, 0.32);
    }
    .pageHeader h1 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      line-height: 28px;
      font-weight: 800;
      white-space: nowrap;
    }
    .logoDot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #5eead4;
      box-shadow: 0 0 8px #5eead4;
    }
    .versionBadge {
      flex: 0 0 auto;
      padding: 3px 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #99f6e4;
      font-size: 11px;
      line-height: 18px;
      font-weight: 700;
    }
    .mainContent { padding: 16px 20px 28px; }
    .legendBox {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 14px;
      padding: 12px 18px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
    }
    .legendItem {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #475569;
      font-size: 12px;
      line-height: 18px;
      white-space: nowrap;
    }
    .legendTitle {
      color: #0f172a;
      font-size: 11px;
      line-height: 18px;
      font-weight: 800;
    }
    .legendDot {
      width: 18px;
      height: 10px;
      border-radius: 3px;
      border: 1px solid currentColor;
    }
    .legendDiamond {
      width: 10px;
      height: 10px;
      border-radius: 1px;
      border: 1px solid currentColor;
      transform: rotate(45deg);
    }
    .scrollWrap {
      overflow: auto;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 28px rgba(0, 0, 0, 0.13);
    }
    #flowSvg {
      display: block;
      background: #fff;
    }
    .node {
      cursor: pointer;
    }
    .node:hover .nodeShape {
      filter: brightness(0.97) saturate(1.08);
      stroke-width: 2.8;
    }
    .popupOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(15, 23, 42, 0.36);
      backdrop-filter: blur(2px);
    }
    .popupOverlay.show { display: block; }
    .popupPanel {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 210;
      display: none;
      flex-direction: column;
      width: 660px;
      max-height: 82vh;
      overflow: hidden;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      transform: translate(-50%, -50%);
    }
    .popupPanel.show { display: flex; }
    .popupHeader {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 22px 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .popupTitle {
      margin-top: 6px;
      color: #0f172a;
      font-size: 18px;
      line-height: 26px;
      font-weight: 800;
    }
    .popupBody {
      overflow-y: auto;
      padding: 18px 22px 22px;
    }
    .detailBlock {
      margin-bottom: 12px;
      padding: 12px 14px;
      border-left: 3px solid #0891b2;
      border-radius: 10px;
      background: #f8fafc;
    }
    .detailBlock h4 {
      margin-bottom: 6px;
      color: #0f172a;
      font-size: 13px;
      line-height: 20px;
      font-weight: 800;
    }
    .detailBlock ul {
      padding-left: 18px;
      color: #475569;
      font-size: 13px;
      line-height: 1.75;
    }
    .tag {
      display: inline-block;
      margin-right: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      line-height: 18px;
      font-weight: 700;
    }
    .tagOps { background: #dbeafe; color: #1d4ed8; }
    .tagSys { background: #cffafe; color: #155e75; }
    .tagAdmin { background: #f3e8ff; color: #7e22ce; }
    .tagUser { background: #ffedd5; color: #9a3412; }
    .tagStage { background: #f1f5f9; color: #475569; }
    .closeButton {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: #f1f5f9;
      color: #64748b;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

          ["租户订阅", ["查看租户当前席位数、到期日、订阅状态、订单来源和销售归属。"]],
          ["消耗对账", ["按租户和时间范围查看消耗积分、成本、毛利、使用人数和最近消耗时间。"]],
        ],
      },
      O5: {
        title: "资源与上架运营",
        lane: "ops",
        stage: "06 运营闭环",
        sections: [
          ["资源池", ["维护模型服务商、模型成本、模型售价和第三方接口计量售价。"]],
          ["商品中心", ["维护 AI 专家商品、分类、客服配置和上架状态。"]],
          ["审批", ["审核 AI 专家平台公开申请，通过后进入平台公开范围。"]],
        ],
      },
      S5: {
        title: "数据回流",
        lane: "system",
        stage: "06 运营闭环",
        sections: [
          ["统计", ["订单、流水、调用、消耗、席位和权限变化进入统计口径。"]],
          ["回流", ["运营人员根据订单、对账和租户订阅数据调整积分包、席位包、签约码和资源价格。"]],
        ],
      },
    };

    const COLORS = {
      ops: "#1d4ed8",
      system: "#0891b2",
      admin: "#7e22ce",
      user: "#ea580c",
      edge: "#64748b",
    };

    function stageIndex(id) {
      return STAGES.findIndex(item => item.id === id);
    }
    function laneIndex(id) {
      return LANES.findIndex(item => item.id === id);
    }
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function nodeById(id) {
      return NODES.find(item => item.id === id);
    }
    function markerId(color) {
      return `arrow-${color.replace("#", "")}`;
    }
    function openPopup(id) {
      const data = DETAIL[id];
      if (!data) return;
      const lane = LANES.find(item => item.id === data.lane);
      document.getElementById("popupBadge").innerHTML = `<span class="tag ${lane.tag}">${lane.label}</span><span class="tag tagStage">${data.stage}</span>`;
      document.getElementById("popupTitle").textContent = data.title;
      document.getElementById("popupBody").innerHTML = data.sections
        .map(([title, items]) => `<section class="detailBlock"><h4>${escapeHtml(title)}</h4><ul>${items.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul></section>`)
        .join("");
      document.getElementById("popupOverlay").classList.add("show");
      document.getElementById("popupPanel").classList.add("show");
    }
    function closePopup() {
      document.getElementById("popupOverlay").classList.remove("show");
      document.getElementById("popupPanel").classList.remove("show");
    }
    function render() {
      const svg = document.getElementById("flowSvg");
      const leftW = 136;
      const topH = 82;
      const stageW = 296;
      const laneH = 250;
      const nodeW = 186;
      const nodeH = 46;
      const width = leftW + stageW * STAGES.length;
      const height = topH + laneH * LANES.length + 76;
      const nodePositions = {};
      const routeCounters = {};

      svg.setAttribute("width", width);
      svg.setAttribute("height", height);
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      let html = `
        <defs>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12" />
          </filter>
          ${["#64748b", "#1d4ed8", "#0891b2", "#7e22ce", "#ea580c"].map(color => `
            <marker id="${markerId(color)}" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L10,5 L0,10 z" fill="${color}" />
            </marker>
          `).join("")}
        </defs>
        <rect x="0" y="0" width="${width}" height="${height}" fill="#ffffff" />
        <rect x="0" y="0" width="${leftW}" height="${topH}" fill="#f8fafc" stroke="#cbd5e1" />
        <text x="${leftW / 2}" y="40" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">阶段 / 应用</text>
      `;

      STAGES.forEach((stage, index) => {
        const x = leftW + index * stageW;
        html += `
          <rect x="${x}" y="0" width="${stageW}" height="${topH}" fill="#f8fafc" stroke="#cbd5e1" />
          <text x="${x + 16}" y="30" font-size="14" font-weight="800" fill="#0f172a">${stage.title}</text>
          <text x="${x + 16}" y="54" font-size="11" fill="#64748b">${stage.sub}</text>
        `;
      });

      LANES.forEach((lane, laneIdx) => {
        const y = topH + laneIdx * laneH;
        html += `
          <rect x="0" y="${y}" width="${leftW}" height="${laneH}" fill="${lane.color}" stroke="#cbd5e1" />
          <text x="44" y="${y + 24}" writing-mode="tb" glyph-orientation-vertical="0" font-size="13" font-weight="800" fill="#ffffff">${lane.label}</text>
          <text x="84" y="${y + 24}" writing-mode="tb" glyph-orientation-vertical="0" font-size="9" fill="#ffffff" opacity="0.75">${lane.short}</text>
        `;
        STAGES.forEach((stage, stageIdx) => {
          const x = leftW + stageIdx * stageW;
          html += `<rect x="${x}" y="${y}" width="${stageW}" height="${laneH}" fill="${stageIdx % 2 === 0 ? "#ffffff" : "#f8fafc"}" stroke="#e2e8f0" />`;
        });
      });

      STAGES.forEach(stage => {
        LANES.forEach(lane => {
          const nodes = NODES.filter(node => node.stage === stage.id && node.lane === lane.id);
          nodes.forEach((node, index) => {
            const x = leftW + stageIndex(stage.id) * stageW + (stageW - nodeW) / 2;
            const y = topH + laneIndex(lane.id) * laneH + 22 + index * 56;
            nodePositions[node.id] = {
              ...node,
              x,
              y,
              w: nodeW,
              h: nodeH,
              cx: x + nodeW / 2,
              cy: y + nodeH / 2,
            };
          });
        });
      });

      function anchor(pos, side) {
        if (side === "left") return { x: pos.x, y: pos.cy };
        if (side === "right") return { x: pos.x + pos.w, y: pos.cy };
        if (side === "top") return { x: pos.cx, y: pos.y };
        return { x: pos.cx, y: pos.y + pos.h };
      }
      function routeOffset(key) {
        const count = routeCounters[key] || 0;
        routeCounters[key] = count + 1;
        return (count - 1) * 12;
      }
      function cleanPoints(points) {
        return points.filter((point, index) => {
          const prev = points[index - 1];
          return !prev || prev.x !== point.x || prev.y !== point.y;
        });
      }
      function roundedPath(points, radius = 10) {
        const clean = cleanPoints(points);
        if (clean.length < 2) return "";
        let d = `M ${clean[0].x} ${clean[0].y}`;
        for (let i = 1; i < clean.length - 1; i += 1) {
          const prev = clean[i - 1];
          const current = clean[i];
          const next = clean[i + 1];
          const v1 = { x: current.x - prev.x, y: current.y - prev.y };
          const v2 = { x: next.x - current.x, y: next.y - current.y };
          if ((v1.x === 0 && v2.x === 0) || (v1.y === 0 && v2.y === 0)) {
            d += ` L ${current.x} ${current.y}`;
            continue;
          }
          const len1 = Math.abs(v1.x || v1.y);
          const len2 = Math.abs(v2.x || v2.y);
          const r = Math.min(radius, len1 / 2, len2 / 2);
          const before = {
            x: current.x - Math.sign(v1.x) * r,
            y: current.y - Math.sign(v1.y) * r,
          };
          const after = {
            x: current.x + Math.sign(v2.x) * r,
            y: current.y + Math.sign(v2.y) * r,
          };
          d += ` L ${before.x} ${before.y} Q ${current.x} ${current.y} ${after.x} ${after.y}`;
        }
        const last = clean[clean.length - 1];
        d += ` L ${last.x} ${last.y}`;
        return d;
      }
      function laneRail(laneId, side, offset = 0) {
        const laneTop = topH + laneIndex(laneId) * laneH;
        return side === "top"
          ? laneTop + 18 + offset
          : laneTop + laneH - 18 - offset;
      }
      function stageRight(stageId) {
        return leftW + (stageIndex(stageId) + 1) * stageW;
      }
      function routeEdge(from, to, options = {}) {
        const fromStage = stageIndex(from.stage);
        const toStage = stageIndex(to.stage);
        const fromLane = laneIndex(from.lane);
        const toLane = laneIndex(to.lane);

        if (options.route === "bottom") {
          const start = anchor(from, "left");
          const end = anchor(to, "right");
          const railY = height - 28 - routeOffset("bottom");
          return [
            start,
            { x: start.x - 24, y: start.y },
            { x: start.x - 24, y: railY },
            { x: end.x + 24, y: railY },
            { x: end.x + 24, y: end.y },
            end,
          ];
        }

        if (fromStage === toStage && fromLane === toLane) {
          const start = anchor(from, "bottom");
          const end = anchor(to, "top");
          if (start.y <= end.y) return [start, end];
          const railX = from.x + from.w + 24 + routeOffset(`${from.stage}-${from.lane}-loop`);
          return [
            anchor(from, "right"),
            { x: railX, y: from.cy },
            { x: railX, y: to.cy },
            anchor(to, "right"),
          ];
        }

        if (fromStage === toStage) {
          const movingDown = fromLane < toLane;
          const side = movingDown ? "right" : "left";
          const start = anchor(from, side);
          const end = anchor(to, side);
          const railX = (movingDown ? from.x + from.w + 24 : from.x - 24) + routeOffset(`${from.stage}-${side}`);
          return [
            start,
            { x: railX, y: start.y },
            { x: railX, y: end.y },
            end,
          ];
        }

        if (fromStage < toStage) {
          const start = anchor(from, "right");
          const end = anchor(to, "left");
          const span = toStage - fromStage;
          const railKey = `${from.stage}-${to.stage}-${from.lane}-${to.lane}`;
          const offset = routeOffset(railKey);

          if (fromLane === toLane) {
            const railY = laneRail(from.lane, "bottom", Math.max(0, offset));
            return span === 1
              ? [start, { x: (start.x + end.x) / 2, y: start.y }, { x: (start.x + end.x) / 2, y: end.y }, end]
              : [start, { x: start.x + 24, y: start.y }, { x: start.x + 24, y: railY }, { x: end.x - 24, y: railY }, { x: end.x - 24, y: end.y }, end];
          }

          const railX = Math.min(stageRight(from.stage) - 18 + offset, end.x - 24);
          return [
            start,
            { x: railX, y: start.y },
            { x: railX, y: end.y },
            end,
          ];
        }

        const start = anchor(from, "left");
        const end = anchor(to, "right");
        const railY = laneRail(from.lane, "bottom", Math.max(0, routeOffset(`${from.stage}-${to.stage}-back`)));
        return [
          start,
          { x: start.x - 24, y: start.y },
          { x: start.x - 24, y: railY },
          { x: end.x + 24, y: railY },
          { x: end.x + 24, y: end.y },
          end,
        ];
      }
      function drawEdge(fromId, toId, options = {}) {
        const from = nodePositions[fromId];
        const to = nodePositions[toId];
        if (!from || !to) return;
        const color = LANES.find(lane => lane.id === from.lane)?.color || COLORS.edge;
        const path = roundedPath(routeEdge(from, to, options));
        const dash = options.dashed ? ` stroke-dasharray="8 8"` : "";
        html += `<path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-opacity="0.78"${dash} marker-end="url(#${markerId(color)})" />`;
      }

      EDGES.forEach(([from, to, options]) => drawEdge(from, to, options));

      NODES.forEach(node => {
        const pos = nodePositions[node.id];
        const lane = LANES.find(item => item.id === node.lane);
        const stroke = node.type === "diamond" ? "#d97706" : lane.color;
        const fill = node.type === "diamond" ? "#fef3c7" : lane.fill;
        const title = escapeHtml(node.title);
        const sub = escapeHtml(node.sub || "");
        if (node.type === "diamond") {
          const cx = pos.cx;
          const cy = pos.cy;
          const points = `${cx},${cy - 33} ${cx + nodeW / 2},${cy} ${cx},${cy + 33} ${cx - nodeW / 2},${cy}`;
          html += `
            <g class="node" data-node="${node.id}" filter="url(#shadow)">
              <polygon class="nodeShape" points="${points}" fill="${fill}" stroke="${stroke}" stroke-width="2" />
              <text x="${cx}" y="${cy - 3}" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">${title}</text>
              <text x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="10" fill="#64748b">${sub}</text>
            </g>
          `;
        } else {
          html += `
            <g class="node" data-node="${node.id}" filter="url(#shadow)">
              <rect class="nodeShape" x="${pos.x}" y="${pos.y}" width="${pos.w}" height="${pos.h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="2" />
              <text x="${pos.x + 14}" y="${pos.y + 20}" font-size="13" font-weight="800" fill="#0f172a">${title}</text>
              <text x="${pos.x + 14}" y="${pos.y + 36}" font-size="10" fill="#64748b">${sub}</text>
            </g>
          `;
        }
      });

      svg.innerHTML = html;
      document.querySelectorAll(".node").forEach(node => {
        node.addEventListener("click", () => openPopup(node.getAttribute("data-node")));
      });
    }

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closePopup();
    });
    render();
  </script>
</body>
</html>
