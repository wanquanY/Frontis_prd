<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontis AI · V0.6 用户故事旅程图</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --surface: rgba(255, 255, 255, 0.96);
        --border: rgba(15, 23, 42, 0.1);
        --text: #081638;
        --text-secondary: #4a5875;
        --text-muted: #7a849b;
        --primary: #00bdd6;
        --primary-dark: #009db4;
        --blue: #3578f6;
        --green: #16a879;
        --purple: #7b61ff;
        --amber: #d88418;
        --rose: #d9486e;
        --shadow-sm: 0 8px 20px rgba(8, 22, 56, 0.08);
        --shadow-md: 0 16px 42px rgba(8, 22, 56, 0.13);
        --shadow-lg: 0 24px 70px rgba(8, 22, 56, 0.16);
        --radius-lg: 18px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 14% 18%, rgba(0, 189, 214, 0.13), transparent 26%),
          radial-gradient(circle at 82% 12%, rgba(123, 97, 255, 0.11), transparent 30%),
          linear-gradient(135deg, #f8fbff 0%, var(--bg) 48%, #eef5f7 100%);
        color: var(--text);
        font-family:
          "PingFang SC",
          "SF Pro Display",
          "Helvetica Neue",
          "Microsoft YaHei",
          Arial,
          sans-serif;
      }

      button {
        font: inherit;
      }

      #viewport {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: grab;
      }

      #viewport.isDragging {
        cursor: grabbing;
      }

      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 4700px;
        height: 1360px;
        transform-origin: 0 0;
      }

      #connections {
        position: absolute;
        inset: 0;
        width: 4700px;
        height: 1360px;
        overflow: visible;
        pointer-events: none;
      }

      .topPanel {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 40;
        width: 390px;
        padding: 16px 18px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(16px);
      }

      .topPanel h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.35;
        letter-spacing: 0;
      }

      .topPanel p {
        margin: 8px 0 0;
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.7;
      }

      .roleSwitch {
        position: fixed;
        top: 18px;
        left: 430px;
        right: 250px;
        z-index: 42;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.93);
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(14px);
      }

      .roleButton {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 14px 0 8px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
      }

      .roleButton:hover,
      .roleButton.isActive {
        border-color: rgba(0, 189, 214, 0.24);
        background: rgba(0, 189, 214, 0.09);
        color: var(--text);
      }

      .roleButtonAvatar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 9px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 900;
      }

      .toolbar {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 42;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(14px);
      }

      .toolbar button {
        min-width: 34px;
        height: 30px;
        border: 1px solid rgba(15, 23, 42, 0.1);
        border-radius: 999px;
        background: #ffffff;
        color: var(--text-secondary);
        cursor: pointer;
      }

      .toolbar button:hover {
        border-color: rgba(0, 189, 214, 0.42);
        color: var(--text);
      }

      #zoomLabel {
        min-width: 48px;
        color: var(--text-muted);
        font-size: 12px;
        text-align: center;
      }

      .roleHero {
        position: absolute;
        top: 120px;
        left: 80px;
        width: 310px;
        min-height: 250px;
        padding: 24px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.93);
        box-shadow: var(--shadow-lg);
      }

      .heroAvatar {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border-radius: 24px;
        color: #ffffff;
        font-size: 26px;
        font-weight: 900;
        box-shadow: 0 14px 30px rgba(8, 22, 56, 0.14);
      }

      .roleHero h2 {
        margin: 18px 0 0;
        font-size: 26px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .roleHero p {
        margin: 10px 0 0;
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 1.75;
      }

      .heroMeta {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 16px;
      }

      .heroMeta span {
        padding: 6px 9px;
        border-radius: 999px;
        background: rgba(8, 22, 56, 0.05);
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 700;
      }

      .timeline {
        position: absolute;
        top: 310px;
        left: 430px;
        width: 4020px;
        height: 2px;
        background: linear-gradient(90deg, rgba(0, 189, 214, 0.1), rgba(0, 189, 214, 0.78), rgba(0, 189, 214, 0.08));
      }

      .stageHeader {
        position: absolute;
        top: 154px;
        width: 270px;
        min-height: 78px;
        padding: 13px 14px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: var(--shadow-sm);
      }

      .stageIndex {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
        height: 22px;
        margin-bottom: 8px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--active-color) 12%, #ffffff);
        color: var(--active-color);
        font-size: 12px;
        font-weight: 800;
      }

      .stageTitle {
        font-size: 15px;
        font-weight: 850;
      }

      .stageDesc {
        margin-top: 4px;
        color: var(--text-muted);
        font-size: 11px;
        line-height: 1.5;
      }

      .momentDot {
        position: absolute;
        top: 299px;
        width: 24px;
        height: 24px;
        border: 6px solid rgba(255, 255, 255, 0.96);
        border-radius: 50%;
        background: var(--active-color);
        box-shadow: 0 8px 22px rgba(8, 22, 56, 0.12);
      }

      .journeyCard {
        position: absolute;
        width: 294px;
        min-height: 228px;
        padding: 15px 15px 13px;
        border: 1px solid rgba(15, 23, 42, 0.1);
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow-md);
      }

      .journeyCard::before {
        content: "";
        position: absolute;
        left: 34px;
        width: 15px;
        height: 15px;
        border-left: 1px solid rgba(15, 23, 42, 0.08);
        border-top: 1px solid rgba(15, 23, 42, 0.08);
        background: rgba(255, 255, 255, 0.94);
        transform: rotate(45deg);
      }

      .journeyCard.isTop::before {
        bottom: -8px;
      }

      .journeyCard.isBottom::before {
        top: -8px;
      }

      .cardTop {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .cardTitle {
        margin: 0;
        font-size: 16px;
        line-height: 1.45;
        font-weight: 850;
      }

      .tag {
        flex: 0 0 auto;
        padding: 4px 8px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--active-color) 12%, #ffffff);
        color: var(--active-color);
        font-size: 11px;
        font-weight: 800;
      }

      .scene {
        margin: 10px 0 0;
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.68;
      }

      .voice {
        position: relative;
        margin-top: 10px;
        padding: 10px 11px;
        border-radius: 14px 14px 14px 5px;
        background: color-mix(in srgb, var(--active-color) 10%, #f8fbff);
        color: #24304c;
        font-size: 12px;
        line-height: 1.58;
      }

      .voice strong {
        color: var(--active-color);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }

      .actions span {
        padding: 4px 7px;
        border-radius: 999px;
        background: rgba(8, 22, 56, 0.05);
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 650;
      }

      .outcome {
        margin-top: 10px;
        padding-top: 9px;
        border-top: 1px dashed rgba(15, 23, 42, 0.12);
        color: var(--text);
        font-size: 12px;
        line-height: 1.55;
      }

      .outcome b {
        color: var(--active-color);
      }

      .connectorPath {
        fill: none;
        stroke: rgba(0, 189, 214, 0.58);
        stroke-width: 3;
      }

      .connectorLabel {
        fill: var(--text-muted);
        font-size: 11px;
        font-weight: 700;
      }

      @media (max-width: 1100px) {
        .topPanel {
          width: calc(100% - 36px);
        }

        .roleSwitch {
          top: 148px;
          left: 18px;
          right: 18px;
        }

        .toolbar {
          top: auto;
          right: 18px;
          bottom: 18px;
        }
      }
    </style>
  </head>
  <body>
    <section class="topPanel" aria-label="说明">
      <h1>Frontis AI · V0.6 用户故事旅程图</h1>
      <p>一次只看一个真实人物的完整旅程：从具体岗位、触达场景和业务任务出发，串联试用、注册、后台管理、飞书绑定、协作、开发和治理。</p>
      <p>操作：切换人物查看不同旅程；拖拽画布平移，滚轮缩放，双击重置。</p>
    </section>

    <nav id="roleSwitch" class="roleSwitch" aria-label="人物切换"></nav>

    <div class="toolbar" aria-label="画布控制">
      <button type="button" id="zoomOut">-</button>
      <span id="zoomLabel">100%</span>
      <button type="button" id="zoomIn">+</button>
      <button type="button" id="resetView">重置</button>
    </div>

    <main id="viewport" aria-label="可拖拽缩放画布">
      <div id="canvas">
        <svg id="connections" aria-hidden="true">
          <defs>
            <marker id="arrowPrimary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(0, 189, 214, 0.68)"></path>
            </marker>
          </defs>
        </svg>
      </div>
    </main>

    <script>
      const roles = [
        {
          key: "liPersonal",
          name: "小李 · 跨境电商运营",
          avatar: "李",
          color: "var(--blue)",
          summary: "小李是跨境电商公司的独立运营，先在飞书群聊里试用 MetaAgent，再被引导到平台注册个人版，随后用个人管理后台管理积分和自己的 AI 专家。",
          traits: ["公有云个人版", "飞书触达", "个人管理后台"],
        },
        {
          key: "zhangTeam",
          name: "小张 · 销售团队成员",
          avatar: "张",
          color: "var(--primary)",
          summary: "小张是团队销售，进入企业工作台后围绕客户跟进使用 MetaAgent 和专家工作室，并把自己的销售方法沉淀成团队可复用 Agent。",
          traits: ["公有云团队版", "企业成员", "专家复用"],
        },
        {
          key: "wangAdmin",

          traits: ["组织管理", "角色权限", "团队看板"],
        },
        {
          key: "chenPrivate",
          name: "陈总 · 私有化客户负责人",
          avatar: "陈",
          color: "var(--green)",
          summary: "陈总负责一家制造企业的私有化部署，要把默认模型供应商、专家成本核算和内部 Agent 建设串成企业闭环。",
          traits: ["私有化租户", "默认模型供应商", "ROI 核算"],
        },
        {
          key: "zhouOps",
          name: "周运营 · 平台运营",
          avatar: "周",
          color: "var(--purple)",
          summary: "周运营负责平台侧租户开通、付费口径类型、资源计量、专家上架和广场投放，确保积分计费和成本计费客户都能被正确治理。",
          traits: ["租户管理", "付费口径", "广场运营"],
        },
      ];

      const journeys = {
        liPersonal: [
          {
            stage: "飞书群聊触达",

          {

      const canvas = document.getElementById("canvas");
      const svg = document.getElementById("connections");
      const viewport = document.getElementById("viewport");
      const zoomLabel = document.getElementById("zoomLabel");
      const roleSwitch = document.getElementById("roleSwitch");

      const layout = {
        heroX: 80,
        stageStartX: 470,
        stageGap: 430,
        stageTop: 154,
        cardTopY: 386,
        cardBottomY: 686,
        dotY: 299,
        cardWidth: 294,
      };

      const state = {
        activeRole: "liPersonal",
        scale: 0.82,
        x: 62,
        y: 72,
        dragging: false,
        startX: 0,
        startY: 0,
        originX: 0,
        originY: 0,
      };

      function createEl(tag, className, text) {
        const el = document.createElement(tag);
        if (className) el.className = className;
        if (text) el.textContent = text;
        return el;
      }

      function getRole(key) {
        return roles.find(role => role.key === key) || roles[0];
      }

      function stageX(index) {
        return layout.stageStartX + index * layout.stageGap;
      }

      function clearCanvas() {
        [...canvas.children].forEach(child => {
          if (child !== svg) child.remove();
        });
        [...svg.children].forEach(child => {
          if (child.tagName.toLowerCase() !== "defs") child.remove();
        });
      }

      function renderRoleSwitch() {
        roleSwitch.innerHTML = "";
        roles.forEach(role => {
          const button = createEl("button", `roleButton ${role.key === state.activeRole ? "isActive" : ""}`);
          button.type = "button";
          button.dataset.role = role.key;
          const avatar = createEl("span", "roleButtonAvatar", role.avatar);
          avatar.style.background = role.color;
          button.appendChild(avatar);
          button.appendChild(document.createTextNode(role.name));
          button.addEventListener("click", () => {
            state.activeRole = role.key;
            renderRoleSwitch();
            renderJourney();
            resetView();
          });
          roleSwitch.appendChild(button);
        });
      }

      function renderHero(role) {
        const hero = createEl("aside", "roleHero");
        hero.style.setProperty("--active-color", role.color);
        const avatar = createEl("div", "heroAvatar", role.avatar);
        avatar.style.background = role.color;
        hero.appendChild(avatar);
        hero.appendChild(createEl("h2", "", role.name));
        hero.appendChild(createEl("p", "", role.summary));
        const meta = createEl("div", "heroMeta");
        role.traits.forEach(item => meta.appendChild(createEl("span", "", item)));
        hero.appendChild(meta);
        canvas.appendChild(hero);
      }

      function renderStages(journey, role) {
        const timeline = createEl("div", "timeline");
        timeline.style.setProperty("--active-color", role.color);
        canvas.appendChild(timeline);

        journey.forEach((item, index) => {
          const x = stageX(index);
          const header = createEl("section", "stageHeader");
          header.style.left = `${x}px`;
          header.style.setProperty("--active-color", role.color);
          header.appendChild(createEl("span", "stageIndex", String(index + 1).padStart(2, "0")));
          header.appendChild(createEl("div", "stageTitle", item.stage));
          header.appendChild(createEl("div", "stageDesc", item.description));
          canvas.appendChild(header);

          const dot = createEl("div", "momentDot");
          dot.id = `dot-${index}`;
          dot.style.left = `${x + 34}px`;
          dot.style.setProperty("--active-color", role.color);
          canvas.appendChild(dot);
        });
      }

      function renderCards(journey, role) {
        journey.forEach((item, index) => {
          const isTop = index % 2 === 0;
          const card = createEl("article", `journeyCard ${isTop ? "isTop" : "isBottom"}`);
          card.id = `card-${index}`;
          card.style.left = `${stageX(index)}px`;
          card.style.top = `${isTop ? layout.cardTopY : layout.cardBottomY}px`;
          card.style.setProperty("--active-color", role.color);

          const top = createEl("div", "cardTop");
          top.appendChild(createEl("h3", "cardTitle", item.title));
          top.appendChild(createEl("span", "tag", item.tag));
          card.appendChild(top);

          card.appendChild(createEl("p", "scene", item.scene));

          const voice = createEl("div", "voice");
          voice.innerHTML = `<strong>心声：</strong>${item.voice}`;
          card.appendChild(voice);

          const actions = createEl("div", "actions");
          item.actions.forEach(action => actions.appendChild(createEl("span", "", action)));
          card.appendChild(actions);

          const outcome = createEl("div", "outcome");
          outcome.innerHTML = `<b>结果：</b>${item.outcome}`;
          card.appendChild(outcome);

          canvas.appendChild(card);
        });
      }

      function renderLinks(journey) {
        journey.forEach((_, index) => {
          if (index >= journey.length - 1) return;
          const from = document.getElementById(`dot-${index}`);
          const to = document.getElementById(`dot-${index + 1}`);
          if (!from || !to) return;
          const fromX = from.offsetLeft + from.offsetWidth;
          const fromY = from.offsetTop + from.offsetHeight / 2;
          const toX = to.offsetLeft;
          const toY = to.offsetTop + to.offsetHeight / 2;
          const d = `M ${fromX} ${fromY} C ${fromX + 150} ${fromY}, ${toX - 150} ${toY}, ${toX - 5} ${toY}`;
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", d);
          path.setAttribute("class", "connectorPath");
          path.setAttribute("marker-end", "url(#arrowPrimary)");
          svg.appendChild(path);

          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("x", `${(fromX + toX) / 2 - 22}`);
          text.setAttribute("y", `${fromY - 12}`);
          text.setAttribute("class", "connectorLabel");
          text.textContent = "下一步";
          svg.appendChild(text);
        });
      }

      function renderJourney() {
        clearCanvas();
        const role = getRole(state.activeRole);
        const journey = journeys[role.key];
        document.documentElement.style.setProperty("--active-color", role.color);
        renderHero(role);
        renderStages(journey, role);
        renderCards(journey, role);
        renderLinks(journey);
      }

      function applyTransform() {
        canvas.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
        zoomLabel.textContent = `${Math.round(state.scale * 100)}%`;
      }

      function zoomAt(delta, clientX = window.innerWidth / 2, clientY = window.innerHeight / 2) {
        const previous = state.scale;
        const next = Math.min(1.45, Math.max(0.42, previous + delta));
        if (next === previous) return;
        const canvasX = (clientX - state.x) / previous;
        const canvasY = (clientY - state.y) / previous;
        state.scale = next;
        state.x = clientX - canvasX * next;
        state.y = clientY - canvasY * next;
        applyTransform();
      }

      function resetView() {
        state.scale = 0.82;
        state.x = 62;
        state.y = 72;
        applyTransform();
      }

      viewport.addEventListener("pointerdown", event => {
        state.dragging = true;
        state.startX = event.clientX;
        state.startY = event.clientY;
        state.originX = state.x;
        state.originY = state.y;
        viewport.classList.add("isDragging");
        viewport.setPointerCapture(event.pointerId);
      });

      viewport.addEventListener("pointermove", event => {
        if (!state.dragging) return;
        state.x = state.originX + event.clientX - state.startX;
        state.y = state.originY + event.clientY - state.startY;
        applyTransform();
      });

      viewport.addEventListener("pointerup", event => {
        state.dragging = false;
        viewport.classList.remove("isDragging");
        viewport.releasePointerCapture(event.pointerId);
      });

      viewport.addEventListener(
        "wheel",
        event => {
          event.preventDefault();
          zoomAt(event.deltaY > 0 ? -0.06 : 0.06, event.clientX, event.clientY);
        },
        { passive: false },
      );

      viewport.addEventListener("dblclick", resetView);
      document.getElementById("zoomOut").addEventListener("click", () => zoomAt(-0.08));
      document.getElementById("zoomIn").addEventListener("click", () => zoomAt(0.08));
      document.getElementById("resetView").addEventListener("click", resetView);

      renderRoleSwitch();
      renderJourney();
      applyTransform();
    </script>
  </body>
</html>
