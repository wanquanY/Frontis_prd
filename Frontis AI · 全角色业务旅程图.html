<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontis AI · 全角色业务旅程图</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel-bg: rgba(255, 255, 255, 0.96);
        --panel-border: rgba(17, 24, 39, 0.08);
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --shadow-lg: 0 18px 48px rgba(15, 23, 42, 0.12);
        --shadow-md: 0 10px 28px rgba(15, 23, 42, 0.12);
        --shadow-sm: 0 6px 18px rgba(15, 23, 42, 0.08);
        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 16px;
        --fde-stroke: #7c3aed;
        --fde-soft: #efe7ff;
        --fde-bg: linear-gradient(145deg, #fbf8ff 0%, #f2ebff 100%);
        --enterprise-stroke: #d97706;
        --enterprise-soft: #fff2d8;
        --enterprise-bg: linear-gradient(145deg, #fffdf8 0%, #fff4df 100%);
        --workspace-stroke: #2563eb;
        --workspace-soft: #dbeafe;
        --workspace-bg: linear-gradient(145deg, #f7fbff 0%, #eaf3ff 100%);
        --merge-stroke: #0f9f74;
        --merge-soft: #daf8ee;
        --merge-bg: linear-gradient(145deg, #f6fffb 0%, #e4fbf2 100%);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(circle at top left, rgba(124, 58, 237, 0.08), transparent 24%),
          radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.08), transparent 28%),
          var(--bg);
        color: var(--text-primary);
        font-family:
          "PingFang SC",
          "SF Pro Display",
          "Helvetica Neue",
          "Microsoft YaHei",
          sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      #toolbar {
        position: fixed;
        top: 18px;
        left: 50%;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 10px;
        transform: translateX(-50%);
        padding: 10px 18px;
        border: 1px solid var(--panel-border);
        border-radius: 999px;
        background: var(--panel-bg);
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(12px);
      }

      #toolbar strong {
        font-size: 14px;
      }

      #toolbar .sub {
        font-size: 12px;
        color: var(--text-muted);
      }

      #toolbar .sep {
        width: 1px;
        height: 16px;
        background: rgba(100, 116, 139, 0.18);
      }

      .toolbarButton {
        border: 1px solid rgba(100, 116, 139, 0.18);
        border-radius: 10px;
        background: #ffffff;
        color: var(--text-secondary);
        padding: 5px 12px;
        cursor: pointer;
        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease;
      }

      .toolbarButton:hover {
        border-color: rgba(37, 99, 235, 0.24);
        background: #f8fbff;
        color: var(--text-primary);
      }

      #zoomLabel {
        min-width: 48px;
        text-align: center;
        font-size: 12px;
        color: var(--text-muted);
      }

      #mapHint {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 30;
        width: 300px;
        padding: 14px 16px;
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(10px);
      }

      #mapHint h1 {
        font-size: 15px;
        line-height: 1.4;
      }

      #mapHint p {
        margin-top: 6px;
        font-size: 12px;
        line-height: 1.65;
        color: var(--text-secondary);
      }

      #mapHint ul {
        margin-top: 10px;
        padding-left: 18px;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.7;
      }

      #legend {
        position: fixed;
        bottom: 18px;
        left: 50%;
        z-index: 32;
        display: flex;
        align-items: center;
        gap: 16px;
        transform: translateX(-50%);
        padding: 10px 16px;
        border: 1px solid var(--panel-border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(10px);
      }

      .legendItem {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .legendDot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }

      #vp {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: grab;
      }

      #vp.pan {
        cursor: grabbing;
      }

      #cv {
        position: absolute;
        top: 0;
        left: 0;
        width: 4920px;
        height: 1500px;
        transform-origin: 0 0;
      }

      .lane {
        position: absolute;
        left: 0;
        width: 4380px;
        border-top: 1px solid rgba(148, 163, 184, 0.15);
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      }

      .lane.theme-fde {
        background: rgba(124, 58, 237, 0.035);
      }

      .lane.theme-enterprise {
        background: rgba(217, 119, 6, 0.032);
      }

      .lane.theme-workspace {
        background: rgba(37, 99, 235, 0.03);
      }

      .laneLabel {
        position: absolute;
        left: 0;
        width: 220px;
        height: 100%;
        padding: 24px 18px;
        border-right: 2px solid rgba(15, 23, 42, 0.05);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
      }

      .laneTag {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
      }

      .laneTag.theme-fde {
        background: var(--fde-soft);
        color: var(--fde-stroke);
      }

      .laneTag.theme-enterprise {
        background: var(--enterprise-soft);
        color: var(--enterprise-stroke);
      }

      .laneTag.theme-workspace {
        background: var(--workspace-soft);
        color: var(--workspace-stroke);
      }

      .laneTitle {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.35;
      }

      .laneDesc {
        font-size: 12px;
        line-height: 1.7;
        color: var(--text-muted);
      }

      .stage {
        position: absolute;
        transform: translateX(-50%);
        padding: 6px 14px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow-sm);
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        white-space: nowrap;
        z-index: 5;
      }

      .node {
        position: absolute;
        z-index: 10;
        width: 214px;
        padding: 14px 14px 16px;
        border-radius: 18px;
        border: 2px solid rgba(148, 163, 184, 0.18);
        box-shadow: var(--shadow-md);
        background: #ffffff;
        text-align: left;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          border-color 0.2s ease;
      }

      .node:hover {
        transform: translateY(-4px);
      }

      .nodeSelected {
        transform: translateY(-6px);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
      }

      .node.theme-fde {
        border-color: rgba(124, 58, 237, 0.32);
        background: var(--fde-bg);
      }

      .node.theme-fde .nodeEyebrow {
        color: var(--fde-stroke);
      }

      .node.theme-enterprise {
        border-color: rgba(217, 119, 6, 0.3);
        background: var(--enterprise-bg);
      }

      .node.theme-enterprise .nodeEyebrow {
        color: var(--enterprise-stroke);
      }

      .node.theme-workspace {
        border-color: rgba(37, 99, 235, 0.28);
        background: var(--workspace-bg);
      }

      .node.theme-workspace .nodeEyebrow {
        color: var(--workspace-stroke);
      }

      .node.theme-merge {
        border-color: rgba(15, 159, 116, 0.28);
        background: var(--merge-bg);
      }

      .node.theme-merge .nodeEyebrow {
        color: var(--merge-stroke);
      }

      .nodeEyebrow {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .nodeTitle {
        margin-top: 6px;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.35;
        color: var(--text-primary);
      }

      .nodeBrief {
        margin-top: 7px;
        font-size: 12px;
        line-height: 1.68;
        color: var(--text-secondary);
      }

      #arrows {
        position: absolute;
        top: 0;
        left: 0;
        width: 4480px;
        height: 1500px;
        overflow: visible;
        pointer-events: none;
        z-index: 2;
      }

      #detailPanel {
        position: fixed;
        top: 18px;
        right: 18px;
        bottom: 18px;
        z-index: 34;
        width: 438px;
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-xl);
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow-lg);
        backdrop-filter: blur(16px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .detailHeader {
        padding: 22px 22px 18px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      }

      .detailHeaderTitle {
        font-size: 18px;
        font-weight: 800;
        line-height: 1.4;
      }

      .detailHeaderSub {
        margin-top: 8px;
        font-size: 12px;
        line-height: 1.75;
        color: var(--text-secondary);
      }

      .detailMetaRow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .detailMetaTag {
        display: inline-flex;
        align-items: center;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.05);
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 700;
      }

      .detailBody {
        flex: 1;
        overflow: auto;
        padding: 18px 22px 22px;
      }

      .detailSection + .detailSection {
        margin-top: 18px;
      }

      .detailSectionTitle {
        font-size: 13px;
        font-weight: 800;
        color: var(--text-primary);
      }

      .detailSectionText {
        margin-top: 8px;
        font-size: 13px;
        line-height: 1.75;
        color: var(--text-secondary);
      }

      .detailList {
        margin-top: 8px;
        padding-left: 18px;
        font-size: 13px;
        line-height: 1.78;
        color: var(--text-secondary);
      }

      .detailList li + li {
        margin-top: 6px;
      }

      .chipList {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .chip {
        padding: 6px 10px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.05);
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.5;
      }

      .detailFootnote {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 16px;
        background: rgba(15, 159, 116, 0.08);
        color: #0b7b59;
        font-size: 12px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <strong>Frontis AI</strong>
      <span class="sub">工作台 / 企业管理后台 / FDE 业务域 · 全角色业务旅程图</span>
      <div class="sep"></div>
      <button class="toolbarButton" onclick="zoomBy(0.12)">＋</button>
      <span id="zoomLabel">100%</span>
      <button class="toolbarButton" onclick="zoomBy(-0.12)">－</button>
      <div class="sep"></div>
      <button class="toolbarButton" onclick="fitMap()">适配</button>
      <button class="toolbarButton" onclick="resetView()">重置</button>
    </div>

    <div id="mapHint">
      <h1>如何阅读这张图</h1>
      <p>主画布只显示各角色主线步骤。点击任一节点，右侧会展开该角色在当前页面里的目标、输入示例、点击按钮、系统反馈和下一步分叉。</p>
      <ul>
        <li>范围只含工作台、企业管理后台、FDE 业务管理域。</li>
        <li>本图按业务口径将 FDE负责人与 FDE团队管理员视为同权管理角色。</li>
        <li>本图按业务口径将企业老板与企业管理员视为同权企业管理角色。</li>
        <li>入口按正式产品统一登录建模，不再沿用 Demo 里的右侧快捷体验按钮。</li>
      </ul>
    </div>

    <aside id="detailPanel" aria-label="节点详情"></aside>

    <div id="legend">
      <div class="legendItem">
        <span class="legendDot" style="background:#7c3aed"></span>
        FDE 业务域
      </div>
      <div class="legendItem">
        <span class="legendDot" style="background:#d97706"></span>
        企业管理后台
      </div>
      <div class="legendItem">
        <span class="legendDot" style="background:#2563eb"></span>
        用户工作台
      </div>
      <div class="legendItem">
        <span class="legendDot" style="background:#0f9f74"></span>
        跨域交接 / 回流
      </div>
    </div>

    <div id="vp">
      <div id="cv">
        <svg id="arrows" aria-hidden="true">
          <defs>
            <marker id="marker-fde" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
              <path d="M0,0 L0,6 L8,3z" fill="#7c3aed"></path>
            </marker>
            <marker
              id="marker-enterprise"
              markerWidth="8"
              markerHeight="8"
              refX="7"
              refY="3"
              orient="auto"
            >
              <path d="M0,0 L0,6 L8,3z" fill="#d97706"></path>
            </marker>
            <marker
              id="marker-workspace"
              markerWidth="8"
              markerHeight="8"
              refX="7"
              refY="3"
              orient="auto"
            >
              <path d="M0,0 L0,6 L8,3z" fill="#2563eb"></path>
            </marker>
            <marker id="marker-merge" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
              <path d="M0,0 L0,6 L8,3z" fill="#0f9f74"></path>
            </marker>
          </defs>
        </svg>
      </div>
    </div>

      const HIDDEN_NODE_IDS = new Set([
        "fdeLeaderLogin",
        "fdeAdminLogin",
        "fdeAdminDeliveryList",
        "fdeAdminOpportunity",
        "fdeAdminOrder",
        "fdeAdminDelivery",

        "bossStore",

        "bossLogin",

        "employeeLogin",

      const visibleNodes = nodes.filter(node => !HIDDEN_NODE_IDS.has(node.id));
      const laneMap = Object.fromEntries(lanes.map(lane => [lane.id, lane]));
      const nodeMap = Object.fromEntries(visibleNodes.map(node => [node.id, node]));

      const vp = document.getElementById("vp");
      const cv = document.getElementById("cv");
      const arrows = document.getElementById("arrows");
      const detailPanel = document.getElementById("detailPanel");
      const zoomLabel = document.getElementById("zoomLabel");

      let scale = 1;
      let tx = 0;
      let ty = 0;
      let drag = null;
      let selectedNodeId = null;

      const renderLanes = () => {
        lanes.forEach(lane => {
          const laneEl = document.createElement("section");
          laneEl.className = `lane theme-${lane.theme}`;
          laneEl.style.left = `${LANE_OFFSET_X}px`;
          laneEl.style.top = `${lane.top}px`;
          laneEl.style.height = `${lane.height}px`;
          laneEl.style.width = `${LANE_WIDTH}px`;

          const labelEl = document.createElement("div");
          labelEl.className = "laneLabel";

            <div class="laneDesc">${lane.desc}</div>

          cv.appendChild(laneEl);

      const renderStages = () => {
        stages.forEach(stage => {
          const stageEl = document.createElement("div");
          stageEl.className = "stage";
          stageEl.style.left = `${stage.x}px`;
          stageEl.style.top = `${typeof stage.top === "number" ? stage.top : 20}px`;

      const renderNodes = () => {
        visibleNodes.forEach(node => {
          const lane = node.laneId ? laneMap[node.laneId] : null;

          nodeEl.type = "button";
          nodeEl.id = node.id;
          nodeEl.className = `node theme-${node.theme}`;
          nodeEl.style.left = `${

          nodeEl.style.top =
            typeof node.top === "number"
              ? `${node.top}px`
              : `${lane.top + node.offsetY}px`;
          nodeEl.innerHTML = `
            <div class="nodeEyebrow">${node.eyebrow}</div>
            <div class="nodeTitle">${node.title}</div>
            <div class="nodeBrief">${node.brief}</div>
          `;
          nodeEl.addEventListener("click", event => {
            event.stopPropagation();
            selectNode(node.id);
          });
          cv.appendChild(nodeEl);
        });
      };

      const createList = items => {
        if (!items || !items.length) {
          return "";
        }

        return `<ul class="detailList">${items.map(item => `<li>${item}</li>`).join("")}</ul>`;
      };

      const createChipList = items => {
        if (!items || !items.length) {
          return "";
        }

        return `<div class="chipList">${items
          .map(item => `<span class="chip">${item}</span>`)
          .join("")}</div>`;
      };

      const renderIntroDetail = () => {
        detailPanel.innerHTML = `
          <div class="detailHeader">
            <div class="detailHeaderTitle">Frontis AI 全角色业务旅程图</div>
            <div class="detailHeaderSub">
              这张图把当前你负责的三个业务域拆成 6 类角色，从进入系统、判断对象、执行页面动作，到交接、回流、版本和结果都串成了一张全局旅程。
            </div>
            <div class="detailMetaRow">
              <span class="detailMetaTag">4 条角色主泳道</span>
              <span class="detailMetaTag">仅含工作台 / 企业后台 / FDE 业务域</span>
              <span class="detailMetaTag">点击节点查看输入、按钮、反馈</span>
            </div>
          </div>
          <div class="detailBody">
            <section class="detailSection">
              <div class="detailSectionTitle">建议阅读顺序</div>
              <ul class="detailList">
                <li>先看 FDE 管理角色与 FDE 普通成员，理解商机到交付到资产的业务主线。</li>
                <li>再看企业管理角色，理解交付完成后如何把设备、权限、模型和人员真的配到企业内。</li>
                <li>最后看普通员工，理解授权结果如何真正变成可用工作台入口和对话产出。</li>
              </ul>
            </section>
            <section class="detailSection">
              <div class="detailSectionTitle">图中已对齐的关键规则</div>
              <ul class="detailList">
                <li>设备一旦分配给员工，工作台自动生成 1:1 默认 Agent。</li>

                <li>FDE 版本管理按单个 Agent 处理，专家团只做分组展示。</li>

              </ul>
            </section>

              这版旅程图已经按你的业务口径收敛：FDE负责人与 FDE团队管理员视为同权管理角色，企业老板与企业管理员视为同权企业管理角色；登录入口也已改成正式产品的统一登录 → 系统列表 → 进入目标系统，其中企业管理后台入口来自工作台账户菜单里的“管理后台”。
            </div>
          </div>
        `;
      };

      const renderNodeDetail = node => {
        const detail = node.detail;
        const metaTags = [
          detail.role,
          detail.domain,
          detail.page,
          detail.route ? `路由 ${detail.route}` : null,
        ].filter(Boolean);

        detailPanel.innerHTML = `
          <div class="detailHeader">
            <div class="detailHeaderTitle">${node.title}</div>
            <div class="detailHeaderSub">${node.brief}</div>
            <div class="detailMetaRow">
              ${metaTags.map(tag => `<span class="detailMetaTag">${tag}</span>`).join("")}
            </div>
          </div>
          <div class="detailBody">
            <section class="detailSection">
              <div class="detailSectionTitle">目标</div>
              <div class="detailSectionText">${detail.goal ?? "-"}</div>
            </section>
            ${
              detail.summary
                ? `
              <section class="detailSection">
                <div class="detailSectionTitle">业务含义</div>
                <div class="detailSectionText">${detail.summary}</div>
              </section>
            `
                : ""
            }
            ${
              detail.operations
                ? `
              <section class="detailSection">
                <div class="detailSectionTitle">页面内关键动作</div>
                ${createList(detail.operations)}
              </section>
            `
                : ""
            }
            ${
              detail.inputs
                ? `
              <section class="detailSection">
                <div class="detailSectionTitle">输入内容 / 示例</div>
                ${createList(detail.inputs)}
              </section>
            `
                : ""
            }
            ${
              detail.buttons
                ? `
              <section class="detailSection">

                ${createChipList(detail.buttons)}
              </section>
            `

            ${
              detail.feedback

                <div class="detailSectionTitle">系统反馈 / 状态变化</div>
                ${createList(detail.feedback)}
              </section>
            `
                : ""
            }
            ${
              detail.next
                ? `
              <section class="detailSection">
                <div class="detailSectionTitle">下一步分叉</div>
                ${createList(detail.next)}
              </section>
            `
                : ""
            }
          </div>
        `;
      };

      const selectNode = nodeId => {
        selectedNodeId = nodeId;
        document.querySelectorAll(".node").forEach(item => item.classList.remove("nodeSelected"));
        const targetNode = document.getElementById(nodeId);
        if (targetNode) {
          targetNode.classList.add("nodeSelected");
        }
        renderNodeDetail(nodeMap[nodeId]);
      };

      const getRect = nodeId => {
        const nodeEl = document.getElementById(nodeId);
        return {
          left: Number.parseFloat(nodeEl.style.left),
          top: Number.parseFloat(nodeEl.style.top),
          width: nodeEl.offsetWidth,
          height: nodeEl.offsetHeight,
          get right() {
            return this.left + this.width;
          },
          get bottom() {
            return this.top + this.height;
          },
          get cx() {
            return this.left + this.width / 2;
          },
          get cy() {
            return this.top + this.height / 2;
          },
        };
      };

      const drawCurve = ({ from, to, theme, dash = "" }) => {
        const a = getRect(from);
        const b = getRect(to);
        const color = themeStroke[theme];
        const marker = themeMarker[theme];
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");

        const horizontalPriority = Math.abs(b.cx - a.cx) >= Math.abs(b.cy - a.cy);
        let x1;
        let y1;
        let x2;
        let y2;
        let c1x;
        let c1y;
        let c2x;
        let c2y;

        if (horizontalPriority) {
          const forward = b.cx >= a.cx;
          x1 = forward ? a.right : a.left;
          y1 = a.cy;
          x2 = forward ? b.left : b.right;
          y2 = b.cy;
          const delta = Math.max(90, Math.abs(x2 - x1) * 0.45);
          c1x = x1 + (forward ? delta : -delta);
          c1y = y1;
          c2x = x2 - (forward ? delta : -delta);
          c2y = y2;
        } else {
          const downward = b.cy >= a.cy;
          x1 = a.cx;
          y1 = downward ? a.bottom : a.top;
          x2 = b.cx;
          y2 = downward ? b.top : b.bottom;
          const delta = Math.max(90, Math.abs(y2 - y1) * 0.45);
          c1x = x1;
          c1y = y1 + (downward ? delta : -delta);
          c2x = x2;
          c2y = y2 - (downward ? delta : -delta);
        }

        path.setAttribute("d", `M${x1},${y1} C${c1x},${c1y} ${c2x},${c2y} ${x2},${y2}`);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", color);
        path.setAttribute("stroke-width", theme === "merge" ? "2.8" : "3.2");
        path.setAttribute("stroke-linecap", "round");
        if (dash) {
          path.setAttribute("stroke-dasharray", dash);
        }
        path.setAttribute("marker-end", `url(#${marker})`);
        arrows.appendChild(path);
      };

      const renderFlows = () => {
        Object.entries(laneFlows).forEach(([laneId, ids]) => {
          const laneTheme = laneMap[laneId].theme;
          ids.forEach((nodeId, index) => {
            const nextNodeId = ids[index + 1];
            if (!nextNodeId) {
              return;
            }
            drawCurve({ from: nodeId, to: nextNodeId, theme: laneTheme });
          });
        });

        crossFlows.forEach(flow => {
          drawCurve(flow);
        });
      };

      const applyTransform = () => {
        cv.style.transform = `matrix(${scale}, 0, 0, ${scale}, ${tx}, ${ty})`;
        zoomLabel.textContent = `${Math.round(scale * 100)}%`;
      };

      const zoomAt = (nextScale, clientX, clientY) => {
        const clamped = Math.min(1.8, Math.max(0.16, nextScale));
        const px = (clientX - tx) / scale;
        const py = (clientY - ty) / scale;
        tx = clientX - px * clamped;
        ty = clientY - py * clamped;
        scale = clamped;
        applyTransform();
      };

      const fitMap = () => {
        const availableWidth = window.innerWidth - DETAIL_WIDTH - VP_PADDING * 2;
        const availableHeight = window.innerHeight - VP_PADDING * 2;
        scale = Math.min(availableWidth / CV_WIDTH, availableHeight / CV_HEIGHT);
        scale = Math.min(scale, 0.62);
        tx = 24;
        ty = 22;
        applyTransform();
      };

      const resetView = () => {
        fitMap();
        if (selectedNodeId) {
          selectNode(selectedNodeId);
        }
      };

      const zoomBy = delta => {
        const safeCenterX = (window.innerWidth - DETAIL_WIDTH) / 2;
        const safeCenterY = window.innerHeight / 2;
        zoomAt(scale + delta, safeCenterX, safeCenterY);
      };

      vp.addEventListener("mousedown", event => {
        if (event.button !== 0) {
          return;
        }

        if (event.target.closest(".node")) {
          return;
        }

        drag = {
          startX: event.clientX,
          startY: event.clientY,
          tx,
          ty,
        };
        vp.classList.add("pan");
      });

      window.addEventListener("mousemove", event => {
        if (!drag) {
          return;
        }

        tx = drag.tx + (event.clientX - drag.startX);
        ty = drag.ty + (event.clientY - drag.startY);
        applyTransform();
      });

      window.addEventListener("mouseup", () => {
        drag = null;
        vp.classList.remove("pan");
      });

      vp.addEventListener(
        "wheel",
        event => {
          event.preventDefault();
          const delta = event.deltaY > 0 ? -0.08 * scale : 0.08 * scale;
          zoomAt(scale + delta, event.clientX, event.clientY);
        },
        { passive: false },
      );

      vp.addEventListener("dblclick", () => {
        resetView();
      });

      window.addEventListener("resize", () => {
        fitMap();
      });

      renderLanes();
      renderStages();
      renderNodes();
      renderFlows();
      renderIntroDetail();
      fitMap();
      selectNode("sharedLogin");

      window.zoomBy = zoomBy;
      window.fitMap = fitMap;
      window.resetView = resetView;
    </script>
