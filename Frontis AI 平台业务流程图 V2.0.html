<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>Frontis AI 平台业务流程图 V2.0</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #eef1f6;
  min-height: 100vh;
}
.page-header {
  background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 60%, #1e40af 100%);
  color: white;
  padding: 18px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 3px 16px rgba(0,0,0,0.35);
  position: sticky;
  top: 0;
  z-index: 100;
}
.page-header h1 {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: 1.5px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.page-header h1 .logo-dot {
  width: 10px; height: 10px;
  background: #60a5fa;
  border-radius: 50%;
  display: inline-block;
  box-shadow: 0 0 8px #60a5fa;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.version-badge {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12px;
  color: #93c5fd;
  font-weight: 600;
}
.date-badge {
  font-size: 11px;
  color: #64748b;
}
.hint-badge {
  font-size: 11px;
  color: #fbbf24;
  display: flex;
  align-items: center;
  gap: 4px;
}
.main-content {
  padding: 20px 24px 32px;
}
.legend-box {
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  padding: 14px 22px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 28px;
  flex-wrap: wrap;
}
.legend-section {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.legend-divider {
  width: 1px;
  height: 26px;
  background: #e2e8f0;
}
.legend-title {
  font-size: 11px;
  font-weight: 800;
  color: #374151;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #4b5563;
  white-space: nowrap;
}
.li-rect { width: 22px; height: 14px; border-radius: 3px; flex-shrink: 0; }
.li-diamond-wrap { width: 14px; height: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.li-diamond { width: 11px; height: 11px; transform: rotate(45deg); border-radius: 1px; }
.li-capsule { width: 30px; height: 14px; border-radius: 7px; flex-shrink: 0; }
.li-border-product { width: 22px; height: 14px; border-radius: 3px; border: 2.5px solid #dc2626; background: #fef2f2; flex-shrink: 0; }
.scroll-wrap {
  overflow-x: auto;
  overflow-y: visible;
  border-radius: 12px;
  box-shadow: 0 4px 28px rgba(0,0,0,0.13);
}
.svg-outer {
  background: #ffffff;
  border-radius: 12px;
  display: inline-block;
  line-height: 0;
}

/* ═══ Node hover & cursor ═══ */
.node-clickable { cursor: pointer; }
.node-clickable:hover rect,
.node-clickable:hover polygon {
  filter: brightness(0.95) saturate(1.2);
  stroke-width: 3;
}
.node-clickable:hover circle {
  filter: brightness(0.9);
}

/* ═══ Popup Overlay ═══ */
#popup-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15,23,42,0.35);
  z-index: 200;
  backdrop-filter: blur(2px);
}
#popup-overlay.show { display: block; }

/* ═══ Popup Panel ═══ */
#popup-panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 620px;
  max-height: 80vh;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  z-index: 210;
  overflow: hidden;
  display: none;
  flex-direction: column;
}
#popup-panel.show {
  display: flex;
  animation: popIn 0.2s ease;
}
@keyframes popIn {
  from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
  to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

.popup-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px 14px;
  border-bottom: 1px solid #f1f5f9;
}
.popup-header .popup-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 99px;
  margin-bottom: 6px;
}
.popup-header h2 {
  font-size: 18px;
  font-weight: 800;
  color: #0f172a;
  margin: 0;
}
.popup-header .close-btn {
  width: 32px; height: 32px;
  border: none;
  background: #f1f5f9;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  color: #64748b;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s;
}
.popup-header .close-btn:hover { background: #e2e8f0; }

.popup-body {
  padding: 20px 24px 24px;
  overflow-y: auto;
  flex: 1;
}
.popup-body p {
  font-size: 13px;
  color: #475569;
  line-height: 1.7;
  margin-bottom: 14px;
}
.popup-body .section-title {
  font-size: 13px;
  font-weight: 700;
  color: #1e293b;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.popup-body .section-title:first-child { margin-top: 0; }

/* Info cards */
.info-card {
  background: #f8fafc;
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 10px;
  border-left: 3px solid #3b82f6;
}
.info-card.red { border-left-color: #dc2626; background: #fef2f2; }
.info-card.green { border-left-color: #16a34a; background: #f0fdf4; }
.info-card.amber { border-left-color: #d97706; background: #fffbeb; }
.info-card.purple { border-left-color: #7e22ce; background: #faf5ff; }
.info-card h4 {
  font-size: 12px;
  font-weight: 700;
  color: #334155;
  margin-bottom: 4px;
}
.info-card ul {
  margin: 0;
  padding-left: 18px;
  font-size: 12px;
  color: #475569;
  line-height: 1.8;
}
.info-card li { margin-bottom: 2px; }

/* Tag */
.tag {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 99px;
  font-weight: 600;
  margin: 2px 4px 2px 0;
}
.tag-blue { background: #dbeafe; color: #1d4ed8; }
.tag-green { background: #dcfce7; color: #15803d; }
.tag-red { background: #fef2f2; color: #dc2626; }
.tag-amber { background: #fef3c7; color: #92400e; }
.tag-purple { background: #f3e8ff; color: #7e22ce; }
.tag-gray { background: #f1f5f9; color: #475569; }

/* Flow arrow */
.flow-arrow {
  text-align: center;
  padding: 8px 0 4px;
  font-size: 12px;
  color: #94a3b8;
}
</style>

// ═══════════════════════════════════════════════════════════════
//  POPUP LOGIC
// ═══════════════════════════════════════════════════════════════
const overlay = document.getElementById('popup-overlay');
const panel   = document.getElementById('popup-panel');
const badgeEl = document.getElementById('popup-badge');
const titleEl = document.getElementById('popup-title');
const bodyEl  = document.getElementById('popup-body');

function openPopup(nodeId) {
  const data = NODE_DATA[nodeId];
  if (!data) return;
  badgeEl.innerHTML = data.badge;
  titleEl.textContent = data.title;
  bodyEl.innerHTML = data.body;
  overlay.classList.add('show');
  panel.classList.add('show');
}

function closePopup() {
  overlay.classList.remove('show');
  panel.classList.remove('show');
}

// Bind click on all clickable nodes
document.querySelectorAll('.node-clickable').forEach(g => {
  g.addEventListener('click', () => {
    const nodeId = g.getAttribute('data-node');
    if (nodeId) openPopup(nodeId);
  });
});

// ESC to close
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePopup();
});
</script>
