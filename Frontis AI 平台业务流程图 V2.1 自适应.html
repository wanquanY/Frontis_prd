function closePopup() {
  document.getElementById('popup-overlay').classList.remove('show');
  document.getElementById('popup-panel').classList.remove('show');
}
function openPopup(id) {
  const data = POPUPS[id];
  if (!data) return;
  document.getElementById('popup-badge').innerHTML = data.badge;
  document.getElementById('popup-title').textContent = data.title;
  document.getElementById('popup-body').innerHTML = data.body;
  document.getElementById('popup-overlay').classList.add('show');
  document.getElementById('popup-panel').classList.add('show');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

// 这里是关键：阶段宽度自动计算
function estimateTextWidth(text, fontSize = 12) {
  return text.replace(/[A-Z0-9]/g, 'aa').length * fontSize * 0.95;
}
function getNodeWidth(node) {
  if (node.type === 'diamond') return 180;
  const titleW = estimateTextWidth(node.title.replace('🟥 ', ''), 12);
  const subW = node.sub ? estimateTextWidth(node.sub, 10) : 0;
  const statusW = node.status ? estimateTextWidth(node.status, 10) : 0;
  return Math.max(145, titleW + 52, subW + 44, statusW + 40);
}
function computeStageWidths(nodes, stages, lanes) {
  const baseGap = 28;              // 普通节点间距
  const minConnectorGap = 54;      // 连线最小安全距离（用户要求纳入自适应）
  const phasePadding = 40;
  const minStageWidth = 460;
  const titlePadding = 96;

  const edgeSet = new Set(
    EDGES.map(([from, to]) => `${from}->${to}`)
  );

  return stages.map(stage => {
    const stageNodes = nodes.filter(n => n.stage === stage.id);
    const laneWidths = lanes.map(lane => {
      const rowNodes = stageNodes.filter(n => n.lane === lane.id);
      if (!rowNodes.length) return 0;

      let width = 0;
      rowNodes.forEach((node, idx) => {
        width += getNodeWidth(node);
        if (idx > 0) {
          const prev = rowNodes[idx - 1];
          const hasDirectEdge = edgeSet.has(`${prev.id}->${node.id}`) || edgeSet.has(`${node.id}->${prev.id}`);
          width += hasDirectEdge ? minConnectorGap : baseGap;
        }
      });
      return width;
    });

    const maxRowWidth = Math.max(...laneWidths, 0);
    const titleWidth = Math.max(estimateTextWidth(stage.title, 13), estimateTextWidth(stage.en, 10)) + titlePadding;
    const width = Math.max(minStageWidth, maxRowWidth + phasePadding * 2, titleWidth);
    return { ...stage, width };
  });
}

function render() {
  const svg = document.getElementById('flowSvg');

  const laneTop = 60;
  const laneH = 120;
  const laneLabelW = 120;
  const headerH = 56;
  const footerH = 60;
  const nodeH = 50;
  const statusH = 20;
  const nodeGap = 28;
  const phasePadding = 40;
  const phaseGap = 0;

  const stageWidths = computeStageWidths(NODES, STAGES, LANES);
  let xCursor = laneLabelW;
  const stagePos = {};
  stageWidths.forEach(s => {
    stagePos[s.id] = { x: xCursor, width: s.width };
    xCursor += s.width + phaseGap;
  });
  const totalWidth = xCursor;
  const totalHeight = laneTop + LANES.length * laneH + footerH;

  svg.setAttribute('width', totalWidth);
  svg.setAttribute('height', totalHeight);

  let html = '';

  // defs
  html += `
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#6b7280"></path></marker>
      <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#2563eb"></path></marker>
      <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#16a34a"></path></marker>
      <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#dc2626"></path></marker>
      <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#9333ea"></path></marker>
      <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#d97706"></path></marker>
      <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#0891b2"></path></marker>
      <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.1)"></feDropShadow></filter>
      <filter id="sh-r" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(220,38,38,0.18)"></feDropShadow></filter>
    </defs>
  `;

  // stage backgrounds
  stageWidths.forEach(s => {
    const { x, width } = stagePos[s.id];
    html += `<rect x="${x}" y="0" width="${width}" height="${totalHeight}" fill="${s.fill}" opacity="0.34"></rect>`;
  });

  // lane background subtle
  LANES.forEach((lane, idx) => {
    const y = laneTop + idx * laneH;
    html += `<rect x="${laneLabelW}" y="${y}" width="${totalWidth - laneLabelW}" height="${laneH}" fill="${lane.fill}" opacity="0.18"></rect>`;
  });

  // stage headers
  html += `<rect x="${laneLabelW}" y="0" width="${totalWidth - laneLabelW}" height="${headerH}" fill="rgba(15,23,42,0.04)"></rect>`;
  stageWidths.forEach(s => {
    const { x, width } = stagePos[s.id];
    html += `<rect x="${x+1}" y="4" width="${width-2}" height="48" rx="6" fill="${s.fill}" opacity="0.84"></rect>`;
    html += `<text x="${x + width/2}" y="23" text-anchor="middle" font-size="13" font-weight="800" fill="${s.text}">${s.title}</text>`;
    html += `<text x="${x + width/2}" y="40" text-anchor="middle" font-size="10" fill="${s.text}">${s.en}</text>`;
  });

  // lane labels
  LANES.forEach((lane, idx) => {
    const y = laneTop + idx * laneH;
    html += `<rect x="0" y="${y}" width="${laneLabelW}" height="${laneH}" fill="${lane.color}"></rect>`;
    html += `<text transform="translate(60,${y + laneH/2}) rotate(-90)" text-anchor="middle" font-size="12" font-weight="700" fill="white">${lane.label}</text>`;
    html += `<text transform="translate(88,${y + laneH/2}) rotate(-90)" text-anchor="middle" font-size="9" fill="white" opacity="0.75">${lane.short}</text>`;
  });
  html += `<rect x="0" y="${laneTop + LANES.length * laneH}" width="${totalWidth}" height="${footerH}" fill="#0f172a"></rect>`;

  // dividers
  html += `<line x1="${laneLabelW}" y1="0" x2="${laneLabelW}" y2="${totalHeight}" stroke="#1e293b" stroke-width="2.5"></line>`;
  [0,1,2,3,4,5].forEach(i => {
    const y = laneTop + i * laneH;
    html += `<line x1="0" y1="${y}" x2="${totalWidth}" y2="${y}" stroke="#cbd5e1" stroke-width="${i===0?1.5:2}"></line>`;
  });
  html += `<line x1="0" y1="${laneTop + LANES.length * laneH}" x2="${totalWidth}" y2="${laneTop + LANES.length * laneH}" stroke="#cbd5e1" stroke-width="1.5"></line>`;
  stageWidths.forEach((s, idx) => {
    if (idx === 0) return;
    const x = stagePos[s.id].x;
    html += `<line x1="${x}" y1="56" x2="${x}" y2="${laneTop + LANES.length * laneH}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8,5"></line>`;
  });

  // layout nodes
  const nodePos = {};
  stageWidths.forEach(stage => {
    const sId = stage.id;
    const { x, width } = stagePos[sId];
    LANES.forEach((lane, laneIndex) => {
      const rowNodes = NODES.filter(n => n.stage === sId && n.lane === lane.id);
      if (!rowNodes.length) return;
      let currentX = x + phasePadding;
      const centerY = laneTop + laneIndex * laneH + laneH / 2;
      rowNodes.forEach((node, idx) => {
        const w = getNodeWidth(node);
        const h = nodeH;
        const nx = currentX;
        const ny = centerY - h / 2;
        nodePos[node.id] = { x: nx, y: ny, w, h, cx: nx + w/2, cy: centerY, stage: sId, lane: lane.id };

        let gapAfter = nodeGap;
        if (idx < rowNodes.length - 1) {
          const next = rowNodes[idx + 1];
          const hasDirectEdge = EDGES.some(([from, to]) => (from === node.id && to === next.id) || (from === next.id && to === node.id));
          gapAfter = hasDirectEdge ? 54 : nodeGap;
        }
        currentX += w + gapAfter;
      });
    });
  });

  // edges first (under nodes)
  function colorMarker(key) {
    return ({gray:'arr',blue:'arr-b',green:'arr-g',amber:'arr-a',red:'arr-r',purple:'arr-p',cyan:'arr-c'})[key] || 'arr';
  }
  function drawPath(from, to, colorKey, label) {
    const c = COLORS[colorKey] || COLORS.gray;
    const marker = colorMarker(colorKey);
    const sameLane = from.lane === to.lane;
    const x1 = from.x + from.w;
    const y1 = from.cy;
    const x2 = to.x;
    const y2 = to.cy;
    let path = '';
    if (sameLane) {
      path = `M ${x1} ${y1} L ${x2} ${y2}`;
    } else {
      const midX = Math.max(x1 + 30, (x1 + x2) / 2);
      path = `M ${x1} ${y1} L ${midX} ${y1} L ${midX} ${y2} L ${x2} ${y2}`;
    }
    html += `<path d="${path}" stroke="${c}" stroke-width="2" fill="none" ${sameLane?'':'stroke-dasharray="5,3"'} marker-end="url(#${marker})"></path>`;
    if (label) {
      html += `<text x="${(x1+x2)/2}" y="${Math.min(y1,y2)-8}" text-anchor="middle" font-size="10" fill="${c}" font-weight="700">${label}</text>`;
    }
  }
  EDGES.forEach(([a,b,color,label]) => {
    if (nodePos[a] && nodePos[b]) drawPath(nodePos[a], nodePos[b], color, label);
  });

  // custom backflow / service reminders / lifecycle line
  if (nodePos.N8 && nodePos.N6) {
    const a=nodePos.N8,b=nodePos.N6;
    html += `<path d="M ${a.cx} ${a.y+a.h} L ${a.cx} ${a.y+a.h+26} L ${b.cx} ${a.y+a.h+26} L ${b.cx} ${b.y}" stroke="#dc2626" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arr-r)"></path>`;
    html += `<text x="${(a.cx+b.cx)/2}" y="${a.y+a.h+20}" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">拒绝 → 修改重提</text>`;
  }
  if (nodePos.N18 && nodePos.N16) {
    const a=nodePos.N18,b=nodePos.N16;
    html += `<path d="M ${a.cx} ${a.y+a.h} L ${a.cx} ${a.y+a.h+26} L ${b.cx} ${a.y+a.h+26} L ${b.cx} ${b.y+b.h}" stroke="#dc2626" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arr-r)"></path>`;
    html += `<text x="${(a.cx+b.cx)/2}" y="${a.y+a.h+20}" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">拒绝→重新跟进</text>`;
  }
  if (nodePos.N37 && nodePos.N36) {
    const a=nodePos.N37,b=nodePos.N36;
    html += `<path d="M ${a.x} ${a.cy} L ${b.cx} ${a.cy} L ${b.cx} ${b.y}" stroke="#dc2626" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arr-r)"></path>`;
    html += `<text x="${(a.x+b.cx)/2}" y="${a.cy-8}" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">拒绝</text>`;
  }
  if (nodePos.N14 && nodePos.N39) {
    html += `<path d="M ${nodePos.N14.cx} 95 L ${nodePos.N14.cx} 64 L ${nodePos.N39.cx} 64 L ${nodePos.N39.cx} 95" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#arr-r)"></path>`;
  }
  if (nodePos.N33 && nodePos.N34) {
    html += `<path d="M ${nodePos.N33.cx} ${nodePos.N33.y+nodePos.N33.h} L ${nodePos.N33.cx} 650 L ${nodePos.N34.cx} 650 L ${nodePos.N34.cx} ${nodePos.N34.y+nodePos.N34.h}" stroke="#64748b" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)"></path>`;
    html += `<text x="${(nodePos.N33.cx+nodePos.N34.cx)/2}" y="644" text-anchor="middle" font-size="9" fill="#64748b">服务到期提醒</text>`;
  }
  if (nodePos.N35A && nodePos.N24) {
    html += `<path d="M ${nodePos.N35A.cx} ${nodePos.N35A.y+nodePos.N35A.h} L ${nodePos.N35A.cx} 690 L ${nodePos.N24.cx} 690 L ${nodePos.N24.cx} ${nodePos.N24.y+nodePos.N24.h}" stroke="#9333ea" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arr-p)"></path>`;
    html += `<text x="${(nodePos.N35A.cx+nodePos.N24.cx)/2}" y="704" text-anchor="middle" font-size="10" fill="#a78bfa" font-weight="700">↺ 续费订单回流至付款流程</text>`;
  }
  if (nodePos.N35B && nodePos.N24) {
    html += `<path d="M ${nodePos.N35B.cx} ${nodePos.N35B.y+nodePos.N35B.h} L ${nodePos.N35B.cx} 690 L ${nodePos.N24.cx} 690" stroke="#dc2626" stroke-width="1.8" fill="none" stroke-dasharray="6,4"></path>`;
  }

  // nodes on top
  NODES.forEach(node => {
    const p = nodePos[node.id];
    if (!p) return;
    const isProduct = !!node.product;
    const stroke = isProduct ? '#dc2626' : (node.type==='diamond' ? '#f59e0b' : (LANES.find(l=>l.id===node.lane)?.color || '#334155'));
    const fill = isProduct ? '#fef2f2' : (node.type==='diamond' ? '#fef3c7' : (LANES.find(l=>l.id===node.lane)?.fill || '#f8fafc'));
    const filter = isProduct ? 'url(#sh-r)' : 'url(#sh)';

    if (node.type === 'diamond') {
      const dW = p.w, dH = 80;
      const cx = p.cx, cy = p.cy;
      const pts = `${cx},${cy-dH/2} ${cx+dW/2},${cy} ${cx},${cy+dH/2} ${cx-dW/2},${cy}`;
      html += `<g class="node-clickable" data-node="${node.id}" filter="${filter}">`;
      html += `<polygon class="shape" points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"></polygon>`;
      const lines = node.title.split('\\n');
      lines.forEach((line, i) => {
        html += `<text x="${cx}" y="${cy - 6 + i*16}" text-anchor="middle" font-size="10" fill="#78350f" font-weight="700">${line}</text>`;
      });
      html += `</g>`;
      html += `<circle cx="${p.x}" cy="${p.cy}" r="10" fill="#d97706"></circle>`;
      html += `<text x="${p.x}" y="${p.cy+4}" text-anchor="middle" font-size="9" fill="white" font-weight="700">${node.id}</text>`;
    } else {
      html += `<g class="node-clickable" data-node="${node.id}" filter="${filter}">`;
      html += `<rect class="shape" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="${isProduct?2.5:2}"></rect>`;
      html += `<text x="${p.cx}" y="${p.y+21}" text-anchor="middle" font-size="10" fill="${isProduct?'#991b1b': (node.lane==='ops' ? '#1e3a8a' : node.lane==='fde' ? '#14532d' : node.lane==='sys' ? '#334155' : node.lane==='admin' ? '#6b21a8' : '#9a3412')}" font-weight="700">${node.title}</text>`;
      if (node.sub) html += `<text x="${p.cx}" y="${p.y+36}" text-anchor="middle" font-size="9" fill="${isProduct?'#dc2626': (node.lane==='ops' ? '#2563eb' : node.lane==='fde' ? '#16a34a' : node.lane==='sys' ? '#64748b' : node.lane==='admin' ? '#7e22ce' : '#ea580c')}">${node.sub}</text>`;
      html += `</g>`;
      const bubbleColor = isProduct ? '#dc2626' : (node.lane==='ops' ? '#2563eb' : node.lane==='fde' ? '#16a34a' : node.lane==='sys' ? '#475569' : node.lane==='admin' ? '#7e22ce' : '#c2410c');
      html += `<circle cx="${p.x}" cy="${p.cy}" r="10" fill="${bubbleColor}"></circle>`;
      html += `<text x="${p.x}" y="${p.cy+4}" text-anchor="middle" font-size="9" fill="white" font-weight="700">${node.id}</text>`;
      if (node.status) {
        const statusMap = {
          amber: { fill:'#fef3c7', stroke:'#f59e0b', text:'#92400e' },
          green: { fill:'#d1fae5', stroke:'#10b981', text:'#065f46' },
          red:   { fill:'#fee2e2', stroke:'#ef4444', text:'#991b1b' },
          blue:  { fill:'#bfdbfe', stroke:'#3b82f6', text:'#1e40af' },
        };
        const st = statusMap[node.statusType || 'amber'];
        const sw = Math.max(108, estimateTextWidth(node.status, 10) + 20);
        html += `<rect x="${p.cx - sw/2}" y="${p.y + p.h + 8}" width="${sw}" height="20" rx="10" fill="${st.fill}" stroke="${st.stroke}" stroke-width="1.5"></rect>`;
        html += `<text x="${p.cx}" y="${p.y + p.h + 22}" text-anchor="middle" font-size="10" fill="${st.text}" font-weight="700">${node.status}</text>`;
      }
    }
  });

  svg.innerHTML = html;

  document.querySelectorAll('.node-clickable').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-node');
      if (id) openPopup(id);
    });
  });
}

render();
</script>
</body>
</html>
