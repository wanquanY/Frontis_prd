function closePopup(){document.getElementById('popup-overlay').classList.remove('show');document.getElementById('popup-panel').classList.remove('show');}
function openPopup(id){const d=POPUPS[id];if(!d)return;document.getElementById('popup-badge').innerHTML=d.badge;document.getElementById('popup-title').textContent=d.title;document.getElementById('popup-body').innerHTML=d.body;document.getElementById('popup-overlay').classList.add('show');document.getElementById('popup-panel').classList.add('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopup();});

function estW(t,s=12){return t.replace(/[A-Z0-9\u4e00-\u9fff]/g,'aa').length*s*0.55;}
function nodeW(n){return n.type==='diamond'?180:Math.max(155,estW(n.title.replace('🟥 ',''),12)+52, n.sub?estW(n.sub,10)+40:0, n.status?estW(n.status,10)+36:0);}

function computeStageWidths(){
  const GAP=28,CONN_GAP=56,PAD=40,MIN=460,TITLE_PAD=96;
  const es=new Set(EDGES.map(([f,t])=>f+'->'+t));
  return STAGES.map(st=>{
    const sn=NODES.filter(n=>n.stage===st.id);
    const lw=LANES.map(la=>{
      const rn=sn.filter(n=>n.lane===la.id);if(!rn.length)return 0;
      return rn.reduce((s,n,i)=>s+nodeW(n)+(i?((es.has(rn[i-1].id+'->'+n.id)||es.has(n.id+'->'+rn[i-1].id))?CONN_GAP:GAP):0),0);
    });
    const mr=Math.max(...lw,0);
    const tw=Math.max(estW(st.title,13),estW(st.en,10))+TITLE_PAD;
    return{...st,width:Math.max(MIN,mr+PAD*2,tw)};
  });
}

function render(){
  const svg=document.getElementById('flowSvg');
  const LT=60,LH=110,LLW=120,HH=56,FH=60,NH=50,SG=0,PHG=14;

  let xc=LLW;const sp={};
  sw.forEach(s=>{sp[s.id]={x:xc,w:s.width};xc+=s.width+PHG;});
  const TW=xc,TH=LT+LANES.length*LH+FH;
  svg.setAttribute('width',TW);svg.setAttribute('height',TH);

  let h='';

    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#16a34a"></path></marker>

    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#9333ea"></path></marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#d97706"></path></marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#0891b2"></path></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.1)"></feDropShadow></filter>
    <filter id="sh-r" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(220,38,38,0.18)"></feDropShadow></filter>
  </defs>`;

  sw.forEach(s=>{const{x,w}=sp[s.id];h+=`<rect x="${x}" y="0" width="${w}" height="${TH}" fill="${s.fill}" opacity="0.32"></rect>`;});
  LANES.forEach((la,i)=>{h+=`<rect x="${LLW}" y="${LT+i*LH}" width="${TW-LLW}" height="${LH}" fill="${la.fill}" opacity="0.16"></rect>`;});

  h+=`<rect x="${LLW}" y="0" width="${TW-LLW}" height="${HH}" fill="rgba(15,23,42,0.04)"></rect>`;
  sw.forEach(s=>{const{x,w}=sp[s.id];
    h+=`<rect x="${x+1}" y="4" width="${w-2}" height="48" rx="6" fill="${s.fill}" opacity="0.84"></rect>`;
    h+=`<text x="${x+w/2}" y="23" text-anchor="middle" font-size="13" font-weight="800" fill="${s.text}">${s.title}</text>`;
    h+=`<text x="${x+w/2}" y="40" text-anchor="middle" font-size="10" fill="${s.text}">${s.en}</text>`;
  });

  LANES.forEach((la,i)=>{const y=LT+i*LH;
    h+=`<rect x="0" y="${y}" width="${LLW}" height="${LH}" fill="${la.color}"></rect>`;
    h+=`<text x="48" y="${y+12}" writing-mode="tb" glyph-orientation-vertical="0" font-size="12" font-weight="700" fill="white">${la.label}</text>`;
    h+=`<text x="78" y="${y+10}" writing-mode="tb" glyph-orientation-vertical="0" font-size="9" fill="white" opacity="0.75">${la.short}</text>`;
  });
  h+=`<rect x="0" y="${LT+LANES.length*LH}" width="${TW}" height="${FH}" fill="#0f172a"></rect>`;

  h+=`<line x1="${LLW}" y1="0" x2="${LLW}" y2="${TH}" stroke="#1e293b" stroke-width="2.5"></line>`;
  [0,1,2,3,4,5].forEach(i=>{const y=LT+i*LH;h+=`<line x1="0" y1="${y}" x2="${TW}" y2="${y}" stroke="#cbd5e1" stroke-width="${i===0?1.5:2}"></line>`;});
  h+=`<line x1="0" y1="${LT+LANES.length*LH}" x2="${TW}" y2="${LT+LANES.length*LH}" stroke="#cbd5e1" stroke-width="1.5"></line>`;
  sw.forEach((s,i)=>{if(i===0)return;const x=sp[s.id].x;h+=`<line x1="${x}" y1="56" x2="${x}" y2="${LT+LANES.length*LH}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8,5"></line>`;});

  const np={};
  sw.forEach(st=>{
    const{x,w}=sp[st.id];
    LANES.forEach((la,li)=>{
      const rn=NODES.filter(n=>n.stage===st.id&&n.lane===la.id);if(!rn.length)return;
      let cx=x+40;const cy=LT+li*LH+LH/2;
      rn.forEach((n,idx)=>{
        const nw=nodeW(n),nh=NH,nx=cx,ny=cy-nh/2;
        const shapeH = n.type==='diamond' ? 78 : nh;
        np[n.id]={x:nx,y:ny,w:nw,h:nh,shapeH,cx:nx+nw/2,cy,stage:st.id,lane:la.id,type:n.type};
        const hasEdge=idx<rn.length-1&&EDGES.some(([f,t])=>(f===n.id&&t===rn[idx+1].id)||(t===n.id&&f===rn[idx+1].id));
        cx+=nw+(hasEdge?56:28);
      });
    });
  });

  function getAnchors(n){
    // 对菱形使用真实图形高度，而不是节点包围盒高度
    const topY = n.cy - (n.shapeH || n.h) / 2;
    const bottomY = n.cy + (n.shapeH || n.h) / 2;
    return {
      left:   { x:n.x,       y:n.cy },
      right:  { x:n.x+n.w,   y:n.cy },
      top:    { x:n.cx,      y:topY },
      bottom: { x:n.cx,      y:bottomY },
    };
  }

  function chooseAnchors(a,b,retreat){
    const A=getAnchors(a), B=getAnchors(b);
    const dx=b.cx-a.cx;
    const dy=b.cy-a.cy;

    if(retreat){
      return { from:A.top, to:B.top, mode:'retreat-top' };
    }

    if(Math.abs(dx) >= Math.abs(dy)){
      if(dx >= 0) return { from:A.right, to:B.left, mode:'horizontal' };
      return { from:A.left, to:B.right, mode:'horizontal-back' };
    }

    if(dy >= 0) return { from:A.bottom, to:B.top, mode:'vertical-down' };
    return { from:A.top, to:B.bottom, mode:'vertical-up' };
  }

  function buildOrthogonalPath(a,b,retreat,level=0){
    const pick = chooseAnchors(a,b,retreat);
    const from = pick.from;
    const to = pick.to;
    const mode = pick.mode;
    const retreatOffset = 44 + level * 18;

    if(mode === 'horizontal'){
      const midX = (from.x + to.x) / 2;
      return `M ${from.x} ${from.y} L ${midX} ${from.y} L ${midX} ${to.y} L ${to.x} ${to.y}`;
    }
    if(mode === 'horizontal-back'){
      const by = Math.min(from.y, to.y) - retreatOffset;
      return `M ${from.x} ${from.y} L ${from.x} ${by} L ${to.x} ${by} L ${to.x} ${to.y}`;
    }
    if(mode === 'vertical-down' || mode === 'vertical-up'){
      const midY = (from.y + to.y) / 2;
      return `M ${from.x} ${from.y} L ${from.x} ${midY} L ${to.x} ${midY} L ${to.x} ${to.y}`;
    }
    if(mode === 'retreat-top'){
      const by = Math.min(from.y, to.y) - retreatOffset;
      return `M ${from.x} ${from.y} L ${from.x} ${by} L ${to.x} ${by} L ${to.x} ${to.y}`;
    }
    return `M ${from.x} ${from.y} L ${to.x} ${to.y}`;
  }

  function drawEdge(a,b,ck,label,dashed,retreat,level=0){
    const c=COLORS[ck]||COLORS.gray, mk=colorMarker(ck);
    const d = buildOrthogonalPath(a,b,retreat,level);
    h+=`<path d="${d}" stroke="${c}" stroke-width="2" fill="none" ${dashed?'stroke-dasharray="5,3"':''} marker-end="url(#${mk})"></path>`;
    if(label){
      const lx=(a.cx+b.cx)/2;
      const ly=Math.min(a.y,b.y)-10-(level*6);
      h+=`<text x="${lx}" y="${ly}" text-anchor="middle" font-size="10" fill="${c}" font-weight="700">${label}</text>`;
    }
  }

  EDGES.forEach(([a,b,ck,label])=>{if(np[a]&&np[b])drawEdge(np[a],np[b],ck,label,false,false,0);});
  SPECIAL_EDGES.forEach((e,idx)=>{
    if(!np[e.from]||!np[e.to])return;
    const retreat=np[e.to].cx<np[e.from].cx || np[e.to].cy<np[e.from].cy;
    drawEdge(np[e.from],np[e.to],e.color,e.label,e.dashed,retreat,idx);
  });

  // Footer text
  h+=`<text x="${TW/2}" y="${TH-18}" text-anchor="middle" font-size="11" fill="#475569">Frontis AI Platform  ©  2026  —  BizFlow V2.2</text>`;

  // Render nodes on top
  NODES.forEach(n=>{
    const p=np[n.id];if(!p)return;
    const ip=!!n.product;
    const stroke=ip?'#dc2626':(n.type==='diamond'?'#f59e0b':(LANES.find(l=>l.id===n.lane)?.color||'#334155'));
    const fill=ip?'#fef2f2':(n.type==='diamond'?'#fef3c7':(LANES.find(l=>l.id===n.lane)?.fill||'#f8fafc'));
    const filter=ip?'url(#sh-r)':'url(#sh)';

    if(n.type==='diamond'){
      const dW=p.w,dH=78,cx=p.cx,cy=p.cy;
      const pts=`${cx},${cy-dH/2} ${cx+dW/2},${cy} ${cx},${cy+dH/2} ${cx-dW/2},${cy}`;
      h+=`<g class="node-clickable" data-node="${n.id}" filter="${filter}">`;
      h+=`<polygon class="shape" points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"></polygon>`;
      const lines=n.title.split('\n');
      lines.forEach((l,i)=>{h+=`<text x="${cx}" y="${cy-5+i*16}" text-anchor="middle" font-size="10" fill="#78350f" font-weight="700">${l}</text>`;});
      h+=`</g>`;
      h+=`<circle cx="${p.x}" cy="${p.cy}" r="10" fill="#d97706"></circle>`;
      h+=`<text x="${p.x}" y="${p.cy+4}" text-anchor="middle" font-size="9" fill="white" font-weight="700">${n.id}</text>`;
    } else {
      h+=`<g class="node-clickable" data-node="${n.id}" filter="${filter}">`;
      h+=`<rect class="shape" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="${ip?2.5:2}"></rect>`;
      const tc=ip?'#991b1b':(n.lane==='ops'?'#1e3a8a':n.lane==='fde'?'#14532d':n.lane==='sys'?'#334155':n.lane==='admin'?'#6b21a8':'#9a3412');
      h+=`<text x="${p.cx}" y="${p.y+21}" text-anchor="middle" font-size="10" fill="${tc}" font-weight="700">${n.title}</text>`;
      if(n.sub){const sc=ip?'#dc2626':(n.lane==='ops'?'#2563eb':n.lane==='fde'?'#16a34a':n.lane==='sys'?'#64748b':n.lane==='admin'?'#7e22ce':'#ea580c');
        h+=`<text x="${p.cx}" y="${p.y+36}" text-anchor="middle" font-size="9" fill="${sc}">${n.sub}</text>`;}
      h+=`</g>`;
      const bc=ip?'#dc2626':(n.lane==='ops'?'#2563eb':n.lane==='fde'?'#16a34a':n.lane==='sys'?'#475569':n.lane==='admin'?'#7e22ce':'#c2410c');
      h+=`<circle cx="${p.x}" cy="${p.cy}" r="10" fill="${bc}"></circle>`;
      h+=`<text x="${p.x}" y="${p.cy+4}" text-anchor="middle" font-size="9" fill="white" font-weight="700">${n.id}</text>`;
      if(n.status){
        const sm={amber:{f:'#fef3c7',s:'#f59e0b',t:'#92400e'},green:{f:'#d1fae5',s:'#10b981',t:'#065f46'},red:{f:'#fee2e2',s:'#ef4444',t:'#991b1b'},blue:{f:'#bfdbfe',s:'#3b82f6',t:'#1e40af'}};
        const st=sm[n.statusType||'amber'],sw2=Math.max(108,estW(n.status,10)+20);
        h+=`<rect x="${p.cx-sw2/2}" y="${p.y+p.h+8}" width="${sw2}" height="20" rx="10" fill="${st.f}" stroke="${st.s}" stroke-width="1.5"></rect>`;
        h+=`<text x="${p.cx}" y="${p.y+p.h+22}" text-anchor="middle" font-size="10" fill="${st.t}" font-weight="700">${n.status}</text>`;
      }
    }
  });

  svg.innerHTML=h;
  document.querySelectorAll('.node-clickable').forEach(el=>{el.addEventListener('click',()=>{const id=el.getAttribute('data-node');if(id)openPopup(id);});});
}
render();
</script>
</body>
</html>
