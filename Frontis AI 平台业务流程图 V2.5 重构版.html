function closePopup(){document.getElementById('popup-overlay').classList.remove('show');document.getElementById('popup-panel').classList.remove('show');}
function openPopup(id){const d=POPUPS[id];if(!d)return;document.getElementById('popup-badge').innerHTML=d.badge;document.getElementById('popup-title').textContent=d.title;document.getElementById('popup-body').innerHTML=d.body;document.getElementById('popup-overlay').classList.add('show');document.getElementById('popup-panel').classList.add('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopup();});

function estW(t,s=12){return t.replace(/[A-Z0-9\u4e00-\u9fff]/g,'aa').length*s*0.55;}
function nodeW(n){return n.type==='diamond'?190:Math.max(160,estW(n.title.replace('🟥 ',''),12)+54, n.sub?estW(n.sub,10)+42:0, n.status?estW(n.status,10)+36:0);}
function markerId(c){return ({gray:'arr',blue:'arr-b',green:'arr-g',amber:'arr-a',red:'arr-r',purple:'arr-p',cyan:'arr-c'})[c]||'arr';}

function computeStageWidths(){
  const GAP=30,CONN_GAP=58,PAD=42,MIN=500,TITLE_PAD=110;
  const es=new Set(EDGES.map(([f,t])=>f+'->'+t));
  return STAGES.map(st=>{
    const sn=NODES.filter(n=>n.stage===st.id);
    const laneSpans=LANES.map(la=>{
      const rn=sn.filter(n=>n.lane===la.id); if(!rn.length) return 0;
      let cursor=0;
      let minX=Infinity;
      let maxX=0;
      rn.forEach((n,idx)=>{
        const gap=idx?((es.has(rn[idx-1].id+'->'+n.id)||es.has(n.id+'->'+rn[idx-1].id))?CONN_GAP:GAP):0;
        cursor+=gap;
        const nx=cursor+(n.dx||0);
        const nw=nodeW(n);
        minX=Math.min(minX,nx);
        maxX=Math.max(maxX,nx+nw);
        cursor=nx+nw;
      });
      const leftOverflow=Math.max(0,-minX);
      const rightSpan=Math.max(0,maxX);
      return leftOverflow + rightSpan;
    });
    const maxLaneSpan=Math.max(...laneSpans,0);
    const titleWidth=Math.max(estW(st.title,13),estW(st.en,10))+TITLE_PAD;
    return {...st,width:Math.max(MIN,maxLaneSpan+PAD*2,titleWidth)+(st.extraWidth||0)};
  });
}

function render(){
  const svg=document.getElementById('flowSvg');
  const LT=60, LH=132, LLW=132, HH=56, FH=60, NH=50, PHG=18;
  const sw=computeStageWidths();
  let xc=LLW; const sp={};
  sw.forEach(s=>{sp[s.id]={x:xc,w:s.width}; xc+=s.width+PHG;});
  const TW=xc, TH=LT+LANES.length*LH+FH;
  svg.setAttribute('width',TW); svg.setAttribute('height',TH);

  let h='';
  h+=`<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#6b7280"></path></marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#2563eb"></path></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#16a34a"></path></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#dc2626"></path></marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#9333ea"></path></marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#d97706"></path></marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#0891b2"></path></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.1)"></feDropShadow></filter>
    <filter id="sh-r" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(220,38,38,0.18)"></feDropShadow></filter>
  </defs>`;

  sw.forEach(s=>{const{x,w}=sp[s.id]; h+=`<rect x="${x}" y="0" width="${w}" height="${TH}" fill="${s.fill}" opacity="0.32"></rect>`;});
  LANES.forEach((la,i)=>{h+=`<rect x="${LLW}" y="${LT+i*LH}" width="${TW-LLW}" height="${LH}" fill="${la.fill}" opacity="0.16"></rect>`;});
  h+=`<rect x="${LLW}" y="0" width="${TW-LLW}" height="${HH}" fill="rgba(15,23,42,0.04)"></rect>`;
  sw.forEach(s=>{const{x,w}=sp[s.id]; h+=`<rect x="${x+1}" y="4" width="${w-2}" height="48" rx="6" fill="${s.fill}" opacity="0.84"></rect>`; h+=`<text x="${x+w/2}" y="23" text-anchor="middle" font-size="13" font-weight="800" fill="${s.text}">${s.title}</text>`; h+=`<text x="${x+w/2}" y="40" text-anchor="middle" font-size="10" fill="${s.text}">${s.en}</text>`;});

  LANES.forEach((la,i)=>{const y=LT+i*LH; h+=`<rect x="0" y="${y}" width="${LLW}" height="${LH}" fill="${la.color}"></rect>`; h+=`<text x="50" y="${y+10}" writing-mode="tb" glyph-orientation-vertical="0" font-size="12" font-weight="700" fill="white">${la.label}</text>`; h+=`<text x="86" y="${y+10}" writing-mode="tb" glyph-orientation-vertical="0" font-size="9" fill="white" opacity="0.75">${la.short}</text>`;});
  h+=`<rect x="0" y="${LT+LANES.length*LH}" width="${TW}" height="${FH}" fill="#0f172a"></rect>`;

  h+=`<line x1="${LLW}" y1="0" x2="${LLW}" y2="${TH}" stroke="#1e293b" stroke-width="2.5"></line>`;
  for(let i=0;i<=LANES.length;i++){const y=LT+i*LH;h+=`<line x1="0" y1="${y}" x2="${TW}" y2="${y}" stroke="#cbd5e1" stroke-width="${i===0||i===LANES.length?1.5:2}"></line>`;}
  sw.forEach((s,i)=>{if(i===0)return;const x=sp[s.id].x;h+=`<line x1="${x}" y1="56" x2="${x}" y2="${LT+LANES.length*LH}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8,5"></line>`;});

  const np={};
  sw.forEach(st=>{
    const{x}=sp[st.id];
    LANES.forEach((la,li)=>{
      const rn=NODES.filter(n=>n.stage===st.id&&n.lane===la.id); if(!rn.length) return;
      let cx=x+42; const cy=LT+li*LH+LH/2;
      rn.forEach((n,idx)=>{
        const nw=nodeW(n), nh=NH, nx=cx+(n.dx||0), ny=cy-nh/2, shapeH=n.type==='diamond'?78:nh;
        np[n.id]={x:nx,y:ny,w:nw,h:nh,shapeH,cx:nx+nw/2,cy,stage:st.id,lane:la.id,type:n.type};
        const hasEdge=idx<rn.length-1&&EDGES.some(([f,t])=>(f===n.id&&t===rn[idx+1].id)||(t===n.id&&f===rn[idx+1].id));
        cx=nx+nw+(hasEdge?58:30);
      });
    });
  });

  function anchors(n){
    const topY=n.cy-(n.shapeH||n.h)/2,bottomY=n.cy+(n.shapeH||n.h)/2;
    return { left:{x:n.x,y:n.cy}, right:{x:n.x+n.w,y:n.cy}, top:{x:n.cx,y:topY}, bottom:{x:n.cx,y:bottomY} };
  }
  function laneIndex(id){ return LANES.findIndex(l=>l.id===id); }
  function stageIndex(id){ return STAGES.findIndex(s=>s.id===id); }
  function edgeBias(colorKey='gray', dashed=false){
    const map={ gray:0, blue:-12, green:12, amber:-20, red:22, purple:30, cyan:-30 };
    return (map[colorKey]||0) + (dashed? (map[colorKey]>=0?12:-12) : 0);
  }
  function resolveAnchor(n, side){
    return anchors(n)[side];
  }
  function chooseTargetSide(a,b,{preferVertical=false, preferBottom=false, preferTop=false}={}){
    const dx=b.cx-a.cx, dy=b.cy-a.cy;
    if(preferBottom) return 'bottom';
    if(preferTop) return 'top';
    if(preferVertical){
      return dy >= 0 ? 'top' : 'bottom';
    }
    if(Math.abs(dx) > Math.abs(dy)) return dx >= 0 ? 'left' : 'right';
    return dy >= 0 ? 'top' : 'bottom';
  }
  function routeMeta(a,b,colorKey,dashed,retreat){
    const A=anchors(a), B=anchors(b);
    const dx=b.cx-a.cx, dy=b.cy-a.cy;
    const sameLane=a.lane===b.lane;
    const sameStage=a.stage===b.stage;
    const liA=laneIndex(a.lane), liB=laneIndex(b.lane);
    const siA=stageIndex(a.stage), siB=stageIndex(b.stage);
    const laneGap=Math.abs(liB-liA), stageGap=Math.abs(siB-siA);
    const bias=edgeBias(colorKey,dashed);

    if(retreat){
      const lift=Math.min(A.top.y,B.top.y)-54-stageGap*14+Math.min(bias,0);
      return { mode:'retreat-top', from:A.top, to:B.top, rail:lift, bias, sameLane, sameStage };
    }

    if(sameStage && !sameLane){
      const nearColumn = Math.abs(dx) < 70;
      const sideOffset = nearColumn ? 34 + laneGap * 8 : 0;

      if(dy < 0){
        const to = B.bottom;
        const from = A.top;
        const viaX = nearColumn ? Math.max(from.x, to.x) + sideOffset : ((from.x + to.x) / 2 + (dx >= 0 ? 12 : -12));
        return { mode: dx < 0 ? 'same-stage-up-back' : 'same-stage-up', from, to, viaX, bias, laneGap, nearColumn };
      }

      const to = B.top;
      const from = A.bottom;
      const viaX = nearColumn ? Math.max(from.x, to.x) + sideOffset : ((from.x + to.x) / 2 + (dx >= 0 ? 12 : -12));
      return { mode: dx < 0 ? 'same-stage-down-back' : 'same-stage-down', from, to, viaX, bias, laneGap, nearColumn };
    }

    if(sameLane && Math.abs(dx)>=Math.abs(dy)){
      if(dx>=0){
        const midX=(A.right.x+B.left.x)/2 + bias*0.35;
        return { mode:'horizontal', from:A.right, to:B.left, rail:midX, bias, sameLane, sameStage };
      }
      const railY=Math.min(A.top.y,B.top.y)-50-stageGap*12+Math.min(bias,0);
      return { mode:'horizontal-back', from:A.left, to:B.right, rail:railY, bias, sameLane, sameStage };
    }

    if(dy>=0){
      const from=A.bottom;
      const targetSide = (dashed && stageGap >= 2) ? 'bottom' : 'top';
      const to=resolveAnchor(b, targetSide);
      const railY=(from.y+to.y)/2 + bias + stageGap*6;
      const enterShift=(siB-siA)*10;
      return { mode:'vertical-down', from, to, rail:railY, enterShift, bias, sameLane, sameStage, laneGap, targetSide };
    }

    const from=A.top;
    const to=resolveAnchor(b,'bottom');
    const railY=(from.y+to.y)/2 + bias - stageGap*6;
    const enterShift=(siB-siA)*10;
    return { mode:'vertical-up', from, to, rail:railY, enterShift, bias, sameLane, sameStage, laneGap, targetSide:'bottom' };
  }
  function levelSafe(v){ return Math.abs(v||0) * 0.25; }
  function path(a,b,colorKey,dashed=false,retreat=false,level=0){
    const meta=routeMeta(a,b,colorKey,dashed,retreat);
    const f=meta.from, t=meta.to;
    const levelShift=level*10*(meta.bias>=0?1:-1);

    if(meta.mode==='horizontal'){
      const mx=meta.rail + levelShift;
      return `M ${f.x} ${f.y} L ${mx} ${f.y} L ${mx} ${t.y} L ${t.x} ${t.y}`;
    }
    if(meta.mode==='horizontal-back'){
      const ry=meta.rail - level*12;
      return `M ${f.x} ${f.y} L ${f.x-20} ${f.y} L ${f.x-20} ${ry} L ${t.x+20} ${ry} L ${t.x+20} ${t.y} L ${t.x} ${t.y}`;
    }
    if(meta.mode==='same-stage-up'){
      const vx=meta.viaX + level*6;
      const preY=t.y + 18;
      return `M ${f.x} ${f.y} L ${vx} ${f.y} L ${vx} ${preY} L ${t.x} ${preY} L ${t.x} ${t.y}`;
    }
    if(meta.mode==='same-stage-down'){
      const vx=meta.viaX + level*6;
      const preY=t.y - 18;
      return `M ${f.x} ${f.y} L ${vx} ${f.y} L ${vx} ${preY} L ${t.x} ${preY} L ${t.x} ${t.y}`;
    }
    if(meta.mode==='same-stage-up-back'){
      const vx=meta.viaX - level*8;
      const preY=t.y + 18;
      return `M ${f.x} ${f.y} L ${vx} ${f.y} L ${vx} ${preY} L ${t.x} ${preY} L ${t.x} ${t.y}`;
    }
    if(meta.mode==='same-stage-down-back'){
      const vx=meta.viaX - level*8;
      const preY=t.y - 18;
      return `M ${f.x} ${f.y} L ${vx} ${f.y} L ${vx} ${preY} L ${t.x} ${preY} L ${t.x} ${t.y}`;
    }
    if(meta.mode==='vertical-down' || meta.mode==='vertical-up'){
      const ry=meta.rail + levelShift;
      const tx=t.x + (meta.enterShift||0) + meta.bias*0.18;
      const preY = meta.targetSide==='bottom' ? t.y+14 : t.y-14*(meta.mode==='vertical-down'?1:-1);
      return `M ${f.x} ${f.y} L ${f.x} ${ry} L ${tx} ${ry} L ${tx} ${preY} L ${t.x} ${t.y}`;
    }
    if(meta.mode==='retreat-top'){
      const ry=meta.rail - level*12;
      return `M ${f.x} ${f.y} L ${f.x} ${ry} L ${t.x} ${ry} L ${t.x} ${t.y}`;
    }
    return `M ${f.x} ${f.y} L ${t.x} ${t.y}`;
  }
  function draw(a,b,ck,label,dashed,retreat,level=0){
    const c=COLORS[ck]||COLORS.gray,mk=markerId(ck),d=path(a,b,ck,dashed,retreat,level);
    const sw=dashed?1.9:2.2;
    h+=`<path d="${d}" stroke="${c}" stroke-width="${sw}" fill="none" ${dashed?'stroke-dasharray="5,4"':''} marker-end="url(#${mk})"></path>`;
    if(label){
      let lx=(a.cx+b.cx)/2;
      let ly=Math.min(a.y,b.y)-10-(level*8)+(dashed?-6:0);
      if(a.stage===b.stage && a.lane!==b.lane){
        lx = (a.cx*0.45 + b.cx*0.55);
        ly = (a.cy+b.cy)/2 + (dashed?-10:-4);
      }
      if(dashed && b.cx < a.cx){
        lx = Math.min(a.cx,b.cx) + 36;
        ly = Math.min(a.y,b.y) - 16 - level*6;
      }
      h+=`<text x="${lx}" y="${ly}" text-anchor="middle" font-size="10" fill="${c}" font-weight="700">${label}</text>`;
    }
  }
  EDGES.forEach(([a,b,ck,label],idx)=>{if(np[a]&&np[b])draw(np[a],np[b],ck,label,false,false,idx%2);});
  SPECIAL_EDGES.forEach((e,idx)=>{if(!np[e.from]||!np[e.to])return;const retreat=np[e.to].cx<np[e.from].cx||np[e.to].cy<np[e.from].cy;draw(np[e.from],np[e.to],e.color,e.label,e.dashed,retreat,idx+1);});

  h+=`<text x="${TW/2}" y="${TH-18}" text-anchor="middle" font-size="11" fill="#475569">Frontis AI Platform  ©  2026  —  BizFlow V2.5</text>`;

  NODES.forEach(n=>{
    const p=np[n.id]; if(!p) return;
    const ip=!!n.product; const stroke=ip?'#dc2626':(n.type==='diamond'?'#f59e0b':(LANES.find(l=>l.id===n.lane)?.color||'#334155')); const fill=ip?'#fef2f2':(n.type==='diamond'?'#fef3c7':(LANES.find(l=>l.id===n.lane)?.fill||'#f8fafc')); const filter=ip?'url(#sh-r)':'url(#sh)';
    if(n.type==='diamond'){
      const dW=p.w,dH=78,cx=p.cx,cy=p.cy,pts=`${cx},${cy-dH/2} ${cx+dW/2},${cy} ${cx},${cy+dH/2} ${cx-dW/2},${cy}`;
      h+=`<g class="node-clickable" data-node="${n.id}" filter="${filter}"><polygon class="shape" points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"></polygon>`;
      n.title.split('\n').forEach((l,i)=>{h+=`<text x="${cx}" y="${cy-5+i*16}" text-anchor="middle" font-size="10" fill="#78350f" font-weight="700">${l}</text>`;});
      h+=`</g><circle cx="${p.x}" cy="${p.cy}" r="10" fill="#d97706"></circle><text x="${p.x}" y="${p.cy+4}" text-anchor="middle" font-size="9" fill="white" font-weight="700">${n.id}</text>`;
    } else {
      const tc=ip?'#991b1b':(n.lane==='ops'?'#1e3a8a':n.lane==='fdeBiz'?'#14532d':n.lane==='fdeDev'?'#3f6212':n.lane==='sys'?'#334155':n.lane==='admin'?'#6b21a8':'#9a3412');
      const sc=ip?'#dc2626':(n.lane==='ops'?'#2563eb':n.lane==='fdeBiz'?'#16a34a':n.lane==='fdeDev'?'#65a30d':n.lane==='sys'?'#64748b':n.lane==='admin'?'#7e22ce':'#ea580c');
      h+=`<g class="node-clickable" data-node="${n.id}" filter="${filter}"><rect class="shape" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="${ip?2.5:2}"></rect>`;
      h+=`<text x="${p.cx}" y="${p.y+21}" text-anchor="middle" font-size="10" fill="${tc}" font-weight="700">${n.title}</text>`;
      if(n.sub)h+=`<text x="${p.cx}" y="${p.y+36}" text-anchor="middle" font-size="9" fill="${sc}">${n.sub}</text>`;
      h+=`</g>`;
      const bc=ip?'#dc2626':(n.lane==='ops'?'#2563eb':n.lane==='fdeBiz'?'#16a34a':n.lane==='fdeDev'?'#65a30d':n.lane==='sys'?'#475569':n.lane==='admin'?'#7e22ce':'#c2410c');
      h+=`<circle cx="${p.x}" cy="${p.cy}" r="10" fill="${bc}"></circle><text x="${p.x}" y="${p.cy+4}" text-anchor="middle" font-size="9" fill="white" font-weight="700">${n.id}</text>`;
      if(n.status){const sm={amber:{f:'#fef3c7',s:'#f59e0b',t:'#92400e'},green:{f:'#d1fae5',s:'#10b981',t:'#065f46'},red:{f:'#fee2e2',s:'#ef4444',t:'#991b1b'},blue:{f:'#bfdbfe',s:'#3b82f6',t:'#1e40af'}};const st=sm[n.statusType||'amber'],sw2=Math.max(108,estW(n.status,10)+20);h+=`<rect x="${p.cx-sw2/2}" y="${p.y+p.h+8}" width="${sw2}" height="20" rx="10" fill="${st.f}" stroke="${st.s}" stroke-width="1.5"></rect><text x="${p.cx}" y="${p.y+p.h+22}" text-anchor="middle" font-size="10" fill="${st.t}" font-weight="700">${n.status}</text>`;}
    }
  });

  svg.innerHTML=h;
  document.querySelectorAll('.node-clickable').forEach(el=>el.addEventListener('click',()=>{const id=el.getAttribute('data-node');if(id)openPopup(id);}));
}
