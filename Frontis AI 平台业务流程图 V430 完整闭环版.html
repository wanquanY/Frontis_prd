const TAG_CLASS_BY_LANE = {
  user: "tag-orange",
  admin: "tag-purple",
  ops: "tag-blue",
  system: "tag-cyan",
};

function closePopup() {
  document.getElementById("popup-overlay").classList.remove("show");
  document.getElementById("popup-panel").classList.remove("show");
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function openPopup(id) {
  const node = NODES.find(item => item.id === id);
  if (!node) return;
  const lane = LANES.find(item => item.id === node.lane);
  const stage = STAGES.find(item => item.id === node.stage);
  const laneTag = TAG_CLASS_BY_LANE[node.lane] || "tag-gray";
  const typeTag = node.type === "diamond" ? "tag-amber" : "tag-gray";
  document.getElementById("popup-badge").innerHTML =
    `<span class="tag ${laneTag}">${escapeHtml(lane ? lane.label : node.lane)}</span>` +
    `<span class="tag tag-indigo">${escapeHtml(stage ? stage.title : node.stage)}</span>` +
    `<span class="tag ${typeTag}">${node.type === "diamond" ? "判断/审批" : "流程节点"}</span>`;
  document.getElementById("popup-title").textContent = node.title.replace(/\n/g, "");
  const detailList = (node.detail || []).map(item => `<li>${escapeHtml(item)}</li>`).join("");
  const status = node.status ? `<p><strong>状态：</strong>${escapeHtml(node.status)}</p>` : "";
  document.getElementById("popup-body").innerHTML =
    `${status}<div class="info-card ${node.statusType === "red" ? "red" : node.statusType === "green" ? "green" : node.statusType === "amber" ? "amber" : node.lane === "admin" ? "purple" : node.lane === "system" ? "cyan" : ""}"><ul>${detailList}</ul></div>`;
  document.getElementById("popup-overlay").classList.add("show");
  document.getElementById("popup-panel").classList.add("show");
}

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closePopup();
});

function estW(text, size = 12) {
  return String(text).replace(/[A-Z0-9\u4e00-\u9fff]/g, "aa").length * size * 0.55;
}

function nodeW(node) {
  const title = String(node.title).replace(/\n/g, "");
  return node.type === "diamond"
    ? Math.max(190, estW(title, 12) + 58)
    : Math.max(190, estW(title, 12) + 60, node.sub ? estW(node.sub, 10) + 48 : 0, node.status ? estW(node.status, 10) + 40 : 0);
}

function markerId(colorKey) {
  return ({ gray: "arr", blue: "arr-b", green: "arr-g", amber: "arr-a", red: "arr-r", purple: "arr-p", cyan: "arr-c", orange: "arr-o" })[colorKey] || "arr";
}

function laneTheme(laneId) {
  return ({
    user: { title: "#9a3412", sub: "#ea580c", badge: "#c2410c" },
    admin: { title: "#6b21a8", sub: "#7e22ce", badge: "#7e22ce" },
    ops: { title: "#1e3a8a", sub: "#2563eb", badge: "#2563eb" },
    system: { title: "#0f766e", sub: "#0891b2", badge: "#0f766e" },
  })[laneId] || { title: "#334155", sub: "#475569", badge: "#475569" };
}

function computeStageWidths() {
  const GAP = 30;
  const CONN_GAP = 58;
  const PAD = 44;
  const MIN = 560;
  const TITLE_PAD = 120;
  const edgeSet = new Set(EDGES.map(([from, to]) => `${from}->${to}`));
  return STAGES.map(stage => {
    const stageNodes = NODES.filter(node => node.stage === stage.id);
    const laneSpans = LANES.map(lane => {
      const laneNodes = stageNodes.filter(node => node.lane === lane.id);
      if (!laneNodes.length) return 0;
      let cursor = 0;
      let maxX = 0;
      laneNodes.forEach((node, index) => {
        const previous = laneNodes[index - 1];
        const gap = index ? (edgeSet.has(`${previous.id}->${node.id}`) || edgeSet.has(`${node.id}->${previous.id}`) ? CONN_GAP : GAP) : 0;
        cursor += gap;
        const width = nodeW(node);
        maxX = Math.max(maxX, cursor + width);
        cursor += width;
      });
      return maxX;
    });
    const titleWidth = Math.max(estW(stage.title, 13), estW(stage.en, 10)) + TITLE_PAD;
    return { ...stage, width: Math.max(MIN, Math.max(...laneSpans, 0) + PAD * 2, titleWidth) + (stage.extraWidth || 0) };
  });
}

function render() {
  const svg = document.getElementById("flowSvg");
  const LANE_TOP = 60;
  const LANE_HEIGHT = 150;
  const LANE_LABEL_WIDTH = 132;
  const HEADER_HEIGHT = 56;
  const FOOTER_HEIGHT = 60;
  const NODE_HEIGHT = 52;
  const STAGE_GAP = 18;
  const stageWidths = computeStageWidths();
  const stagePos = {};
  let cursorX = LANE_LABEL_WIDTH;
  stageWidths.forEach(stage => {
    stagePos[stage.id] = { x: cursorX, w: stage.width };
    cursorX += stage.width + STAGE_GAP;
  });
  const totalWidth = cursorX;
  const totalHeight = LANE_TOP + LANES.length * LANE_HEIGHT + FOOTER_HEIGHT;
  svg.setAttribute("width", totalWidth);
  svg.setAttribute("height", totalHeight);

  let html = `<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#64748b"></path></marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#2563eb"></path></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#16a34a"></path></marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#d97706"></path></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#dc2626"></path></marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#9333ea"></path></marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#0891b2"></path></marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#ea580c"></path></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.1)"></feDropShadow></filter>
  </defs>`;

  stageWidths.forEach(stage => {
    const { x, w } = stagePos[stage.id];
    html += `<rect x="${x}" y="0" width="${w}" height="${totalHeight}" fill="${stage.fill}" opacity="0.32"></rect>`;
  });

  LANES.forEach((lane, index) => {
    const y = LANE_TOP + index * LANE_HEIGHT;
    html += `<rect x="${LANE_LABEL_WIDTH}" y="${y}" width="${totalWidth - LANE_LABEL_WIDTH}" height="${LANE_HEIGHT}" fill="${lane.fill}" opacity="0.16"></rect>`;
  });

  html += `<rect x="${LANE_LABEL_WIDTH}" y="0" width="${totalWidth - LANE_LABEL_WIDTH}" height="${HEADER_HEIGHT}" fill="rgba(15,23,42,0.04)"></rect>`;
  stageWidths.forEach(stage => {
    const { x, w } = stagePos[stage.id];
    html += `<rect x="${x + 1}" y="4" width="${w - 2}" height="48" rx="6" fill="${stage.fill}" opacity="0.84"></rect>`;
    html += `<text x="${x + w / 2}" y="23" text-anchor="middle" font-size="13" font-weight="800" fill="${stage.text}">${stage.title}</text>`;
    html += `<text x="${x + w / 2}" y="40" text-anchor="middle" font-size="10" fill="${stage.text}">${stage.en}</text>`;
  });

  LANES.forEach((lane, index) => {
    const y = LANE_TOP + index * LANE_HEIGHT;
    html += `<rect x="0" y="${y}" width="${LANE_LABEL_WIDTH}" height="${LANE_HEIGHT}" fill="${lane.color}"></rect>`;
    html += `<text x="50" y="${y + 16}" writing-mode="tb" glyph-orientation-vertical="0" font-size="12" font-weight="700" fill="white">${lane.label}</text>`;
    html += `<text x="86" y="${y + 16}" writing-mode="tb" glyph-orientation-vertical="0" font-size="9" fill="white" opacity="0.75">${lane.short}</text>`;
  });

  html += `<rect x="0" y="${LANE_TOP + LANES.length * LANE_HEIGHT}" width="${totalWidth}" height="${FOOTER_HEIGHT}" fill="#0f172a"></rect>`;
  html += `<text x="${totalWidth / 2}" y="${totalHeight - 18}" text-anchor="middle" font-size="11" fill="#cbd5e1">Frontis AI Platform  ©  2026  —  BizFlow V430 Complete Loop</text>`;
  html += `<line x1="${LANE_LABEL_WIDTH}" y1="0" x2="${LANE_LABEL_WIDTH}" y2="${totalHeight}" stroke="#1e293b" stroke-width="2.5"></line>`;

  for (let index = 0; index <= LANES.length; index += 1) {
    const y = LANE_TOP + index * LANE_HEIGHT;
    html += `<line x1="0" y1="${y}" x2="${totalWidth}" y2="${y}" stroke="#cbd5e1" stroke-width="${index === 0 || index === LANES.length ? 1.5 : 2}"></line>`;
  }

  stageWidths.forEach((stage, index) => {
    if (index === 0) return;
    const x = stagePos[stage.id].x;
    html += `<line x1="${x}" y1="56" x2="${x}" y2="${LANE_TOP + LANES.length * LANE_HEIGHT}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8,5"></line>`;
  });

  const nodePos = {};
  stageWidths.forEach(stage => {
    const stageX = stagePos[stage.id].x;
    LANES.forEach((lane, laneIndex) => {
      const laneNodes = NODES.filter(node => node.stage === stage.id && node.lane === lane.id);
      if (!laneNodes.length) return;
      let nodeX = stageX + 44;
      const nodeCenterY = LANE_TOP + laneIndex * LANE_HEIGHT + LANE_HEIGHT / 2;
      laneNodes.forEach((node, index) => {
        const width = nodeW(node);
        const height = NODE_HEIGHT;
        const x = nodeX;
        const y = nodeCenterY - height / 2;
        const shapeHeight = node.type === "diamond" ? 82 : height;
        nodePos[node.id] = {
          x,
          y,
          w: width,
          h: height,
          shapeHeight,
          cx: x + width / 2,
          cy: nodeCenterY,
          lane: lane.id,
          stage: stage.id,
        };
        const nextNode = laneNodes[index + 1];
        const hasDirectEdge = nextNode ? EDGES.some(([from, to]) => from === node.id && to === nextNode.id) : false;
        nodeX = x + width + (hasDirectEdge ? 58 : 30);
      });
    });
  });

  function anchors(node) {
    const shapeTop = node.cy - node.shapeHeight / 2;
    const shapeBottom = node.cy + node.shapeHeight / 2;
    return {
      left: { x: node.x, y: node.cy },
      right: { x: node.x + node.w, y: node.cy },
      top: { x: node.cx, y: shapeTop },
      bottom: { x: node.cx, y: shapeBottom },
    };
  }

  function laneIndex(laneId) {
    return LANES.findIndex(lane => lane.id === laneId);
  }

  function stageIndex(stageId) {
    return STAGES.findIndex(stage => stage.id === stageId);
  }

  function routePath(fromNode, toNode, colorKey, dashed, level) {
    const fromAnchors = anchors(fromNode);
    const toAnchors = anchors(toNode);
    const sameLane = fromNode.lane === toNode.lane;
    const sameStage = fromNode.stage === toNode.stage;
    const forward = toNode.cx >= fromNode.cx;
    const biasMap = { gray: 0, blue: -10, green: 10, amber: -18, red: 22, purple: 28, cyan: -28, orange: 16 };
    const bias = (biasMap[colorKey] || 0) + level * 8;

    if (sameLane && forward) {
      const from = fromAnchors.right;
      const to = toAnchors.left;
      const midX = (from.x + to.x) / 2 + bias * 0.2;
      return `M ${from.x} ${from.y} L ${midX} ${from.y} L ${midX} ${to.y} L ${to.x} ${to.y}`;
    }

    if (sameLane && !forward) {
      const from = fromAnchors.left;
      const to = toAnchors.right;
      const railY = Math.min(fromNode.y, toNode.y) - 54 - level * 12;
      return `M ${from.x} ${from.y} L ${from.x - 22} ${from.y} L ${from.x - 22} ${railY} L ${to.x + 22} ${railY} L ${to.x + 22} ${to.y} L ${to.x} ${to.y}`;
    }

    const fromLaneIndex = laneIndex(fromNode.lane);
    const toLaneIndex = laneIndex(toNode.lane);
    const fromStageIndex = stageIndex(fromNode.stage);
    const toStageIndex = stageIndex(toNode.stage);
    const movingDown = toLaneIndex >= fromLaneIndex;
    const movingForwardStage = toStageIndex >= fromStageIndex;
    const from = movingDown ? fromAnchors.bottom : fromAnchors.top;
    const to = movingDown ? toAnchors.top : toAnchors.bottom;

    if (sameStage) {
      const viaX = Math.max(from.x, to.x) + 34 + Math.abs(toLaneIndex - fromLaneIndex) * 8 + level * 6;
      const preY = movingDown ? to.y - 18 : to.y + 18;
      return `M ${from.x} ${from.y} L ${viaX} ${from.y} L ${viaX} ${preY} L ${to.x} ${preY} L ${to.x} ${to.y}`;
    }

    if (!movingForwardStage || dashed) {
      const railY = Math.min(from.y, to.y) - 58 - Math.abs(toStageIndex - fromStageIndex) * 10 - level * 10;
      return `M ${from.x} ${from.y} L ${from.x} ${railY} L ${to.x} ${railY} L ${to.x} ${to.y}`;
    }

    const railY = (from.y + to.y) / 2 + bias;
    const midX = (from.x + to.x) / 2 + bias * 0.2;
    return `M ${from.x} ${from.y} L ${from.x} ${railY} L ${midX} ${railY} L ${midX} ${to.y} L ${to.x} ${to.y}`;
  }

  function drawEdge(fromId, toId, colorKey, label, dashed = false, level = 0) {
    const fromNode = nodePos[fromId];
    const toNode = nodePos[toId];
    if (!fromNode || !toNode) return;
    const color = COLORS[colorKey] || COLORS.gray;
    const path = routePath(fromNode, toNode, colorKey, dashed, level);
    html += `<path d="${path}" stroke="${color}" stroke-width="${dashed ? 1.9 : 2.2}" fill="none" ${dashed ? 'stroke-dasharray="5,4"' : ""} marker-end="url(#${markerId(colorKey)})"></path>`;
    if (label) {
      let labelX = (fromNode.cx + toNode.cx) / 2;
      let labelY = Math.min(fromNode.y, toNode.y) - 10 - level * 5;
      if (fromNode.stage === toNode.stage && fromNode.lane !== toNode.lane) {
        labelX = (fromNode.cx * 0.45 + toNode.cx * 0.55);
        labelY = (fromNode.cy + toNode.cy) / 2 - 4;
      }
      html += `<text x="${labelX}" y="${labelY}" text-anchor="middle" font-size="10" fill="${color}" font-weight="700">${label}</text>`;
    }
  }

  EDGES.forEach(([from, to, colorKey, label], index) => drawEdge(from, to, colorKey, label, false, index % 2));
  SPECIAL_EDGES.forEach((edge, index) => drawEdge(edge.from, edge.to, edge.color, edge.label, edge.dashed, index + 1));

  NODES.forEach(node => {
    const pos = nodePos[node.id];
    if (!pos) return;
    const lane = LANES.find(item => item.id === node.lane);
    const theme = laneTheme(node.lane);
    const stroke = node.type === "diamond" ? "#f59e0b" : (lane ? lane.color : "#334155");
    const fill = node.type === "diamond" ? "#fef3c7" : (lane ? lane.fill : "#f8fafc");
    if (node.type === "diamond") {
      const diamondHeight = pos.shapeHeight;
      const points = `${pos.cx},${pos.cy - diamondHeight / 2} ${pos.cx + pos.w / 2},${pos.cy} ${pos.cx},${pos.cy + diamondHeight / 2} ${pos.cx - pos.w / 2},${pos.cy}`;
      html += `<g class="node-clickable" data-node="${node.id}" filter="url(#sh)"><polygon class="shape" points="${points}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"></polygon>`;
      node.title.split("\n").forEach((line, index) => {
        html += `<text x="${pos.cx}" y="${pos.cy - 5 + index * 16}" text-anchor="middle" font-size="10" fill="#78350f" font-weight="700">${line}</text>`;
      });
      html += `</g>`;
      html += `<circle cx="${pos.x}" cy="${pos.cy}" r="11" fill="#d97706"></circle><text x="${pos.x}" y="${pos.cy + 4}" text-anchor="middle" font-size="8" fill="white" font-weight="700">${node.id}</text>`;
    } else {
      html += `<g class="node-clickable" data-node="${node.id}" filter="url(#sh)"><rect class="shape" x="${pos.x}" y="${pos.y}" width="${pos.w}" height="${pos.h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="2"></rect>`;
      html += `<text x="${pos.cx}" y="${pos.y + 21}" text-anchor="middle" font-size="10" fill="${theme.title}" font-weight="700">${node.title}</text>`;
      if (node.sub) {
        html += `<text x="${pos.cx}" y="${pos.y + 37}" text-anchor="middle" font-size="9" fill="${theme.sub}">${node.sub}</text>`;
      }
      html += `</g>`;
      html += `<circle cx="${pos.x}" cy="${pos.cy}" r="11" fill="${theme.badge}"></circle><text x="${pos.x}" y="${pos.cy + 4}" text-anchor="middle" font-size="8" fill="white" font-weight="700">${node.id}</text>`;
      if (node.status) {
        const statusThemeMap = {
          amber: { fill: "#fef3c7", stroke: "#f59e0b", text: "#92400e" },
          green: { fill: "#d1fae5", stroke: "#10b981", text: "#065f46" },
          red: { fill: "#fee2e2", stroke: "#ef4444", text: "#991b1b" },
          blue: { fill: "#bfdbfe", stroke: "#3b82f6", text: "#1e40af" },
        };
        const statusTheme = statusThemeMap[node.statusType || "amber"];
        const statusWidth = Math.max(108, estW(node.status, 10) + 20);
        html += `<rect x="${pos.cx - statusWidth / 2}" y="${pos.y + pos.h + 8}" width="${statusWidth}" height="20" rx="10" fill="${statusTheme.fill}" stroke="${statusTheme.stroke}" stroke-width="1.5"></rect>`;
        html += `<text x="${pos.cx}" y="${pos.y + pos.h + 22}" text-anchor="middle" font-size="10" fill="${statusTheme.text}" font-weight="700">${node.status}</text>`;
      }
    }
  });

  svg.innerHTML = html;
  document.querySelectorAll(".node-clickable").forEach(element => {
    element.addEventListener("click", () => {
      const id = element.getAttribute("data-node");
      if (id) openPopup(id);
    });
  });
}

render();
</script>
</body>
</html>
