<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>统一用户体系 Demo</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --surface-soft: #f8fbff;
      --line: #dbe3ee;
      --text: #17212b;
      --muted: #6a7688;
      --blue: #2563eb;
      --blue-soft: #ebf3ff;
      --green: #18794e;
      --green-soft: #eaf8ef;
      --amber: #9a5b06;
      --amber-soft: #fff3dd;
      --red: #c2410c;
      --red-soft: #fff0ea;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 14px;
      --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --sidebar-width: clamp(232px, 20vw, 276px);
      --sidebar-pad: clamp(14px, 1.8vw, 18px);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.08), transparent 28%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      min-height: 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    .app {
      min-height: 100vh;
    }

    .auth-shell {
      width: min(1280px, calc(100vw - clamp(20px, 4vw, 48px)));
      margin: 0 auto;
      min-height: 100vh;
      display: grid;
      align-items: center;
      padding: clamp(16px, 3vw, 28px) 0;
    }

    .hero {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(37, 99, 235, 0.12);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: var(--blue-soft);
      color: var(--blue);
      border: 1px solid #d3e3ff;
      font-size: 24px;
      font-weight: 700;
    }

    .brand-title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
    }

    .brand-subtitle {
      color: var(--muted);
      margin-top: 4px;
    }

    .auth-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .card h1,
    .card h2,
    .card h3 {
      margin: 0;
    }

    .page-title {
      font-size: 34px;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .field-group {
      margin-top: 16px;
    }

    .field-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .field-control {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 12px 14px;
      outline: none;
      color: var(--text);
    }

    .field-control:focus {
      border-color: #a7c5ff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
    }

    .button {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #fff;
      color: var(--text);
      font-weight: 600;
      transition: 0.18s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      border-color: #c8d6ea;
    }

    .button.primary {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .button.ghost {
      background: var(--surface-soft);
    }

    .button.danger {
      background: var(--red-soft);
      color: var(--red);
      border-color: #ffd0c2;
    }

    .button.small {
      min-height: 34px;
      padding: 0 12px;
      font-size: 13px;
    }

    .sample-list,
    .choice-list,
    .stack {
      display: grid;
      gap: 12px;
    }

    .sample-card,
    .choice-card {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 16px;
      background: #fff;
      transition: 0.18s ease;
    }

    .sample-card:hover,
    .choice-card:hover {
      border-color: #bed3f9;
      transform: translateY(-1px);
    }

    .sample-head,
    .choice-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .meta,
    .meta-text {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .badge,
    .pill,
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .status.enabled {
      background: var(--green-soft);
      color: var(--green);
    }

    .status.disabled {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .status.deleted {
      background: var(--red-soft);
      color: var(--red);
    }

    .workspace {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    .sidebar {
      background: rgba(255, 255, 255, 0.92);
      border-right: 1px solid var(--line);
      padding: clamp(16px, 2vw, 22px) var(--sidebar-pad) 116px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }

    .sidebar .brand {
      margin-bottom: 20px;
    }

    .module-switch {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .module-btn {
      flex: 1;
      min-height: 38px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-soft);
      font-weight: 700;
      color: var(--muted);
    }

    .module-btn.active {
      background: var(--blue-soft);
      border-color: #cfe1ff;
      color: var(--blue);
    }

    .nav-group + .nav-group {
      margin-top: 20px;
    }

    .nav-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      padding-left: 10px;
    }

    .nav-list {
      display: grid;
      gap: 8px;
    }

    .sidebar-body {
      display: grid;
      gap: 18px;
    }

    .nav-item {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 600;
      color: var(--text);
      border: 1px solid transparent;
    }

    .nav-item.active {
      background: var(--blue-soft);
      color: var(--blue);
      border-color: #d0e0fb;
    }

    .sidebar-foot {
      position: fixed;
      left: var(--sidebar-pad);
      bottom: 18px;
      width: calc(var(--sidebar-width) - var(--sidebar-pad) - var(--sidebar-pad));
      z-index: 12;
    }

    .main {
      padding: clamp(16px, 2.2vw, 28px);
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .breadcrumb {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .title {
      font-size: 30px;
      line-height: 1.15;
      margin: 0;
    }

    .account-box {
      position: relative;
    }

    .account-btn {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      padding: 12px 14px;
    }

    .account-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      width: 100%;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 10px;
      z-index: 8;
      display: grid;
      gap: 8px;
    }

    .account-item {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 12px;
      background: var(--surface-soft);
    }

    .surface {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, #fff 0%, #f8fbff 100%);
    }

    .metric strong {
      display: block;
      font-size: 26px;
      line-height: 1;
      color: var(--blue);
      margin-bottom: 10px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(280px, 0.95fr) minmax(0, 1.05fr);
      gap: 16px;
    }

    .split-wide {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.95fr);
      gap: 16px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .tab-btn {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-soft);
      color: var(--muted);
      font-weight: 700;
    }

    .tab-btn.active {
      background: var(--blue-soft);
      color: var(--blue);
      border-color: #cfe1ff;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
    }

    table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
    }

    .table-action {
      color: inherit;
      font-weight: 700;
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f8fafc;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .tree-wrap {
      margin-top: 14px;
    }

    .org-tree,
    .org-tree ul {
      list-style: none;
      padding-left: 20px;
      margin: 0;
      position: relative;
    }

    .org-tree ul::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 8px;
      left: 7px;
      width: 1px;
      background: #d9e3ef;
    }

    .org-tree li {
      position: relative;
      margin-top: 10px;
    }

    .org-tree li::before {
      content: "";
      position: absolute;
      left: -13px;
      top: 20px;
      width: 12px;
      height: 1px;
      background: #d9e3ef;
    }

    .tree-node {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      background: #fff;
      cursor: pointer;
    }

    .tree-node.active {
      background: var(--blue-soft);
      border-color: #cfe1ff;
    }

    .tree-node-title {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-weight: 700;
    }

    .tree-node-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .tree-node-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .tree-node-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .tree-node:hover .tree-node-actions,
    .tree-node:focus-within .tree-node-actions,
    .tree-node.active .tree-node-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .roles {
      display: grid;
      gap: 12px;
    }

    .role-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      background: #fff;
    }

    .role-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .permission-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .permission {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 18px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      background: var(--surface-soft);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.42);
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 30;
    }

    .modal {
      width: min(920px, 100%);
      background: #fff;
      border-radius: 26px;
      border: 1px solid var(--line);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.2);
      padding: 22px;
      max-height: calc(100vh - 40px);
      overflow: auto;
    }

    .modal.small {
      width: min(560px, 100%);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 16px;
    }

    .modal-title {
      margin: 0;
      font-size: 24px;
    }

    .close {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-soft);
      font-size: 18px;
    }

    .wizard-steps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .wizard-step {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      background: var(--surface-soft);
      color: var(--muted);
      font-weight: 700;
    }

    .wizard-step.active {
      background: var(--blue-soft);
      color: var(--blue);
      border-color: #cfe1ff;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .check-list {
      display: grid;
      gap: 10px;
    }

    .check-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      background: var(--surface-soft);
    }

    .tree-check {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      background: var(--surface-soft);
      max-height: 320px;
      overflow: auto;
    }

    .tree-check ul {
      list-style: none;
      padding-left: 18px;
      margin: 0;
    }

    .tree-check li + li {
      margin-top: 8px;
    }

    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      padding: 12px 16px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      color: #fff;
      font-weight: 700;
    }

    .toast.success {
      background: var(--green);
    }

    .toast.error {
      background: var(--red);
    }

    .toast.info {
      background: var(--blue);
    }

    @media (max-width: 1200px) {
      .split,
      .split-wide {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 980px) {
      .auth-grid,
      .workspace,
      .metrics,
      .two-col,
      .wizard-steps {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--line);
        padding-bottom: 18px;
      }

      .sidebar-foot {
        position: static;
        width: auto;
      }
    }

    @media (max-width: 720px) {
      .auth-shell {
        width: min(100vw - 18px, 1280px);
      }

      .main {
        padding: 14px;
      }

      .hero,
      .card,
      .surface,
      .modal {
        padding: 18px;
      }

      .page-title,
      .title {
        font-size: 24px;
      }

      table {
        min-width: 620px;
      }

      .account-menu {
        width: min(280px, calc(100vw - 40px));
      }
    }
  </style>
</head>
<body>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script>

    function loadState() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (raw && raw.schemaVersion === SCHEMA_VERSION) return raw;
      } catch (error) {}
      const initial = createInitialState();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
      return initial;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getUser(userId) {
      return state.users.find((item) => item.id === userId) || null;
    }

    function getTenant(tenantId) {
      return state.tenants.find((item) => item.id === tenantId) || null;
    }

    function getRole(roleId) {
      return state.roles.find((item) => item.id === roleId) || null;
    }

    function getNode(nodeId) {
      return state.nodes.find((item) => item.id === nodeId) || null;
    }

    function getMember(memberId) {
      return state.members.find((item) => item.id === memberId) || null;
    }

    function findUserByPhone(phone) {
      return state.users.find((item) => item.phone === String(phone || "").trim()) || null;
    }

    function membersByTenant(tenantId) {
      return state.members.filter((item) => item.tenantId === tenantId && item.status !== "deleted");
    }

    function rolesByTenant(tenantId) {
      return state.roles.filter((item) => item.tenantId === tenantId);
    }

    function nodesByTenant(tenantId) {
      return state.nodes.filter((item) => item.tenantId === tenantId);
    }

    function rootNode(tenantId) {
      return nodesByTenant(tenantId).find((item) => !item.parentId) || null;
    }

    function childrenOf(nodeId) {
      return state.nodes.filter((item) => item.parentId === nodeId);
    }

    function nodePath(nodeId) {
      const names = [];
      let cursor = getNode(nodeId);
      const seen = new Set();
      while (cursor && !seen.has(cursor.id)) {
        seen.add(cursor.id);
        names.unshift(cursor.name);
        cursor = cursor.parentId ? getNode(cursor.parentId) : null;
      }
      return names.join(" / ");
    }

    function descendants(nodeId) {
      const result = [];
      function walk(id) {
        result.push(id);
        childrenOf(id).forEach((child) => walk(child.id));
      }
      walk(nodeId);
      return result;
    }

    function memberName(memberId) {
      const member = getMember(memberId);
      if (!member) return "-";
      return getUser(member.userId)?.name || "-";
    }

    function memberPhone(memberId) {
      const member = getMember(memberId);
      if (!member) return "-";
      return getUser(member.userId)?.phone || "-";
    }

    function roleNames(roleIds) {
      return roleIds.map((roleId) => getRole(roleId)?.name).filter(Boolean).join(" / ");
    }

    function memberRoleNames(member) {
      return roleNames(member?.roleIds || []);
    }

    function isNodeLeaderMember(member, tenantId = member?.tenantId) {
      if (!member || !tenantId) return false;
      return nodesByTenant(tenantId).some((node) => node.leaderMemberId === member.id);
    }

    function memberIdentityLabel(member) {
      if (!member) return "";
      if (isTenantAdmin(member)) return "租户管理员";
      if (isNodeLeaderMember(member)) return "负责人";
      return "普通成员";
    }

    function memberDataScopeLabel(member) {
      if (!member) return "-";
      if (isTenantAdmin(member) || isOperatorAdmin(member)) return "全部数据";
      if (isNodeLeaderMember(member)) return "负责节点及下级";
      return "仅本人";
    }

    function comboIdentityMeta(combo) {
      const member = getMember(combo.memberId);
      return {
        identity: memberIdentityLabel(member),
        roles: memberRoleNames(member),
      };
    }

    function effectiveRolePages(role, tenant = currentTenant()) {
      if (!role) return { cms: [], fdeBusiness: [], fdeDev: [], enterprise: [] };
      if (role.builtInKey === "tenantAdmin") {
        return deepCopy(tenant.permissions.modules);
      }
      return deepCopy(role.pages);
    }

    function roleCount(roleId) {
      return state.members.filter((item) => item.status !== "deleted" && item.roleIds.includes(roleId)).length;
    }

    function orderTotal(tenant) {
      return tenant.orders.reduce((sum, item) => sum + Number(String(item.amount || "").replace(/[^0-9.]/g, "")), 0);
    }

    function assetSummary(tenant) {
      return `${tenant.assetInfo.cloudDevices}云 / ${tenant.assetInfo.localDevices}本地 / ${tenant.assetInfo.seats}席 / ${tenant.assetInfo.points}积分`;
    }

    function orderSummary(tenant) {
      return `${tenant.orders.length}笔 / ${orderTotal(tenant)}万`;
    }

    function normalizePhone(value) {
      return String(value || "").trim();
    }

    function authBucket(phone) {
      const key = normalizePhone(phone);
      if (!state.auth) state.auth = { loginFailures: {}, codeCooldowns: {} };
      if (!state.auth.loginFailures) state.auth.loginFailures = {};
      if (!state.auth.codeCooldowns) state.auth.codeCooldowns = {};
      return {
        key,
        failure: state.auth.loginFailures[key] || { count: 0, lockUntil: 0 },
        codeCooldownUntil: state.auth.codeCooldowns[key] || 0,
      };
    }

    function lockInfo(phone) {
      const bucket = authBucket(phone);
      const remainingMs = Math.max(0, bucket.failure.lockUntil - Date.now());
      return {
        locked: remainingMs > 0,
        remainingSeconds: Math.ceil(remainingMs / 1000),
        remainingMinutes: Math.ceil(remainingMs / 60000),
      };
    }

    function recordLoginFailure(phone) {
      const bucket = authBucket(phone);
      const nextCount = Number(bucket.failure.count || 0) + 1;
      const lockUntil = nextCount >= LOGIN_MAX_FAILURES ? Date.now() + LOGIN_LOCK_MINUTES * 60 * 1000 : 0;
      state.auth.loginFailures[bucket.key] = { count: nextCount, lockUntil };
      saveState();
      return lockInfo(phone);
    }

    function clearLoginFailure(phone) {
      const bucket = authBucket(phone);
      delete state.auth.loginFailures[bucket.key];
      saveState();
    }

    function loginError(phone) {
      const info = recordLoginFailure(phone);
      if (info.locked) {
        showToast(`登录异常，请 ${info.remainingMinutes} 分钟后重试`, "error");
        return;
      }
      showToast("登录异常，请稍后重试", "error");
    }

    function codeCooldownInfo(phone) {
      const bucket = authBucket(phone);
      const remainingMs = Math.max(0, bucket.codeCooldownUntil - Date.now());
      return {
        active: remainingMs > 0,
        remainingSeconds: Math.ceil(remainingMs / 1000),
      };
    }

    function recordCodeCooldown(phone) {
      const bucket = authBucket(phone);
      state.auth.codeCooldowns[bucket.key] = Date.now() + CODE_COOLDOWN_SECONDS * 1000;
      saveState();
    }

    function intersectModules(list, allowed) {
      return list.filter((item) => allowed.includes(item));
    }

    function memberPageAccessForPermissions(member, tenant, platformKey, permissions) {
      const pages = new Set();
      const enabledModules = permissions.modules[platformKey] || [];
      const platformEnabled = Boolean(permissions.platforms[platformKey]);
      member.roleIds.forEach((roleId) => {
        const role = getRole(roleId);
        if (!role) return;
        if (role.builtInKey === "tenantAdmin") {
          if (platformEnabled) enabledModules.forEach((page) => pages.add(page));
          return;
        }
        if (role.builtInKey === "operatorAdmin") {
          if (platformKey === "cms" && platformEnabled) enabledModules.forEach((page) => pages.add(page));
          return;
        }
        intersectModules(role.pages[platformKey] || [], enabledModules).forEach((page) => pages.add(page));
      });
      return Array.from(pages);
    }

    function memberPlatformAccessForPermissions(member, tenant, permissions) {
      const access = { cms: false, fdeBusiness: false, fdeDev: false, enterprise: false };
      Object.keys(access).forEach((platformKey) => {
        access[platformKey] = memberPageAccessForPermissions(member, tenant, platformKey, permissions).length > 0;
      });
      return access;
    }

    function responsibleFdePageSnapshot(tenant) {
      return {
        cms: tenant.permissions.platforms.cms ? ["cmsHome"] : [],
        fdeBusiness: tenant.permissions.platforms.fdeBusiness ? ["fdeBusinessHome", "childTenants"] : [],
        fdeDev: tenant.permissions.platforms.fdeDev ? ["fdeDevHome"] : [],
        enterprise: tenant.permissions.platforms.enterprise ? ["enterpriseHome"] : [],
      };
    }

    function platformAccessFromPages(pages) {
      return {
        cms: Boolean((pages.cms || []).length),
        fdeBusiness: Boolean((pages.fdeBusiness || []).length),
        fdeDev: Boolean((pages.fdeDev || []).length),
        enterprise: Boolean((pages.enterprise || []).length),
      };
    }

    function sessionPlatformAccess() {
      if (state.session?.platformAccessSnapshot) return state.session.platformAccessSnapshot;
      const member = currentMember();
      const tenant = currentTenant();
      return member && tenant ? memberPlatformAccess(member, tenant) : { cms: false, fdeBusiness: false, fdeDev: false, enterprise: false };
    }

    function captureSessionAccess(member, tenant) {
      return {
        platformAccessSnapshot: memberPlatformAccess(member, tenant),
        pageAccessSnapshot: {
          cms: memberPageAccess(member, tenant, "cms"),
          fdeBusiness: memberPageAccess(member, tenant, "fdeBusiness"),
          fdeDev: memberPageAccess(member, tenant, "fdeDev"),
          enterprise: memberPageAccess(member, tenant, "enterprise"),
        },
      };
    }

    function normalizeTenantPermissions(tenant, nextPermissions) {
      const normalized = deepCopy(nextPermissions);
      if (!tenant.parentId) return normalized;
      const parent = getTenant(tenant.parentId);
      if (!parent) return normalized;
      ["cms", "fdeBusiness", "fdeDev", "enterprise"].forEach((key) => {
        normalized.platforms[key] = normalized.platforms[key] && parent.permissions.platforms[key];
        normalized.modules[key] = intersectModules(normalized.modules[key] || [], parent.permissions.modules[key] || []);
        if (!normalized.platforms[key]) normalized.modules[key] = [];
      });
      return normalized;
    }

    function countPermissionImpact(tenant, nextPermissions) {
      const activeMembers = membersByTenant(tenant.id).filter((item) => item.status === "enabled");
      return activeMembers.filter((member) => {
        const beforePlatforms = memberPlatformAccessForPermissions(member, tenant, tenant.permissions);
        const afterPlatforms = memberPlatformAccessForPermissions(member, tenant, nextPermissions);
        return ["cms", "fdeBusiness", "fdeDev", "enterprise"].some((key) => {
          if (beforePlatforms[key] && !afterPlatforms[key]) return true;
          const beforePages = memberPageAccessForPermissions(member, tenant, key, tenant.permissions);
          const afterPages = memberPageAccessForPermissions(member, tenant, key, nextPermissions);
          return beforePages.some((page) => !afterPages.includes(page));
        });
      }).length;
    }

    function enabledPlatformKeys(tenant) {
      return Object.entries(tenant.permissions.platforms)
        .filter(([, value]) => Boolean(value))
        .map(([key]) => key);
    }

    function memberPlatformAccess(member, tenant) {
      return memberPlatformAccessForPermissions(member, tenant, tenant.permissions);
    }

    function memberPageAccess(member, tenant, platformKey) {
      return memberPageAccessForPermissions(member, tenant, platformKey, tenant.permissions);
    }

    function isTenantAdmin(member) {
      return member.roleIds.some((roleId) => getRole(roleId)?.builtInKey === "tenantAdmin");
    }

    function isOperatorAdmin(member) {
      return member.roleIds.some((roleId) => getRole(roleId)?.builtInKey === "operatorAdmin");
    }

    function currentMember() {
      if (!state.session?.memberId) return null;
      return getMember(state.session.memberId);
    }

    function currentTenant() {
      return getTenant(state.session?.tenantId || "");
    }

    function currentPlatform() {
      return state.session?.platform || "";
    }

    function currentFdeModule() {
      return state.session?.fdeModule || "fdeBusiness";
    }

    function availableCombosForUser(userId) {
      const combos = [];
      const comboKeys = new Set();
      const enabledMembers = state.members.filter((item) => item.userId === userId && item.status === "enabled");

      function pushCombo(member, tenant, platform, sublabel, pageAccessSnapshot = null, platformAccessSnapshot = null) {
        const key = `${tenant.id}|${member.id}|${platform}`;
        if (comboKeys.has(key)) return;
        comboKeys.add(key);
        combos.push({
          key,
          memberId: member.id,
          tenantId: tenant.id,
          platform,
          label: PLATFORM_LABELS[platform],
          sublabel,
          pageAccessSnapshot,
          platformAccessSnapshot,
        });
      }

      enabledMembers.forEach((member) => {
        const tenant = getTenant(member.tenantId);
        if (!tenant || tenant.status !== "enabled") return;
        const access = memberPlatformAccess(member, tenant);
        if (access.cms) {
          pushCombo(member, tenant, "cms", "");
        }
        if (access.fdeBusiness || access.fdeDev) {
          pushCombo(member, tenant, "fde", [access.fdeBusiness ? "业务" : "", access.fdeDev ? "开发" : ""].filter(Boolean).join(" / "));
        }
        if (access.enterprise) {
          pushCombo(member, tenant, "enterprise", "");
        }
      });

      return combos.sort((a, b) => {
        const tb = state.recentCombos[b.key] || 0;
        const ta = state.recentCombos[a.key] || 0;
        return tb - ta;
      });
    }

    function tenantPlatformChoicesForUser(userId, tenantId) {
      const tenant = getTenant(tenantId);
      if (!tenant || tenant.status !== "enabled") return [];
      const choices = [];
      const directChoices = availableCombosForUser(userId).filter((item) => item.tenantId === tenantId);
      const seen = new Set();
      directChoices.forEach((item) => {
        seen.add(item.key);
        choices.push(item);
      });
      const linkedMember = state.members.find((item) => item.id === tenant.linkedFdeMemberId && item.userId === userId && item.status === "enabled");
      if (linkedMember) {
        const pageSnapshot = responsibleFdePageSnapshot(tenant);
        const platformSnapshot = platformAccessFromPages(pageSnapshot);
        if (platformSnapshot.cms) {
          const key = `linked|${tenant.id}|${linkedMember.id}|cms`;
          if (!seen.has(key)) choices.push({ key, memberId: linkedMember.id, tenantId: tenant.id, platform: "cms", label: PLATFORM_LABELS.cms, sublabel: "负责FDE", pageAccessSnapshot: pageSnapshot, platformAccessSnapshot: platformSnapshot });
        }
        if (platformSnapshot.fdeBusiness || platformSnapshot.fdeDev) {
          const key = `linked|${tenant.id}|${linkedMember.id}|fde`;
          if (!seen.has(key)) choices.push({ key, memberId: linkedMember.id, tenantId: tenant.id, platform: "fde", label: PLATFORM_LABELS.fde, sublabel: [platformSnapshot.fdeBusiness ? "业务" : "", platformSnapshot.fdeDev ? "开发" : "", "负责FDE"].filter(Boolean).join(" / "), pageAccessSnapshot: pageSnapshot, platformAccessSnapshot: platformSnapshot });
        }
        if (platformSnapshot.enterprise) {
          const key = `linked|${tenant.id}|${linkedMember.id}|enterprise`;
          if (!seen.has(key)) choices.push({ key, memberId: linkedMember.id, tenantId: tenant.id, platform: "enterprise", label: PLATFORM_LABELS.enterprise, sublabel: "负责FDE", pageAccessSnapshot: pageSnapshot, platformAccessSnapshot: platformSnapshot });
        }
      }
      return choices;
    }

    function groupedCombosForUser(userId) {
      const grouped = new Map();
      availableCombosForUser(userId).forEach((combo) => {
        if (!grouped.has(combo.tenantId)) grouped.set(combo.tenantId, { tenant: getTenant(combo.tenantId), combos: [], sortValue: 0 });
        const group = grouped.get(combo.tenantId);
        group.combos.push(combo);
        group.sortValue = Math.max(group.sortValue, state.recentCombos[combo.key] || 0);
      });
      return Array.from(grouped.values()).sort((a, b) => b.sortValue - a.sortValue || a.tenant.name.localeCompare(b.tenant.name, "zh-CN"));
    }

    function updateRecentCombo(key) {
      state.recentCombos[key] = Date.now();
      saveState();
    }

    function login() {
      const phone = normalizePhone(ui.loginPhone);
      const loginLock = lockInfo(phone);
      if (loginLock.locked) {
        showToast(`登录异常，请 ${loginLock.remainingMinutes} 分钟后重试`, "error");
        return;
      }
      const user = findUserByPhone(phone);
      if (!user) {
        loginError(phone);
        return;
      }
      if (ui.sentPhone !== phone) {
        loginError(phone);
        return;
      }
      if (ui.loginCode.trim() !== DEMO_CODE) {
        loginError(phone);
        return;
      }
      clearLoginFailure(phone);
      const combos = availableCombosForUser(user.id);
      if (!combos.length) {
        showToast("暂无可进入平台", "error");
        return;
      }
      state.session = { userId: user.id, memberId: "", tenantId: "", platform: "", fdeModule: "fdeBusiness", platformAccessSnapshot: null, pageAccessSnapshot: null };
      saveState();
      if (combos.length === 1) {
        enterCombo(combos[0]);
        return;
      }
      ui.screen = "combo";
      render();
    }

    function sendCode() {
      const phone = normalizePhone(ui.loginPhone);
      const cooldown = codeCooldownInfo(phone);
      if (cooldown.active) {
        showToast(`操作频繁，请 ${cooldown.remainingSeconds} 秒后重试`, "error");
        return;
      }
      const user = findUserByPhone(phone);
      if (!user) {
        showToast("发送失败，请稍后重试", "error");
        return;
      }
      ui.sentPhone = user.phone;
      recordCodeCooldown(user.phone);
      render();
      showToast("验证码已发送", "success");
    }

    function enterCombo(combo) {
      const member = getMember(combo.memberId);
      const tenant = getTenant(combo.tenantId);
      const snapshot = combo.pageAccessSnapshot
        ? { pageAccessSnapshot: combo.pageAccessSnapshot, platformAccessSnapshot: combo.platformAccessSnapshot || platformAccessFromPages(combo.pageAccessSnapshot) }
        : captureSessionAccess(member, tenant);
      const access = snapshot.platformAccessSnapshot;
      state.session = {
        userId: member.userId,
        memberId: member.id,
        tenantId: tenant.id,
        platform: combo.platform,
        fdeModule: access.fdeBusiness ? "fdeBusiness" : "fdeDev",
        platformAccessSnapshot: snapshot.platformAccessSnapshot,
        pageAccessSnapshot: snapshot.pageAccessSnapshot,
      };
      saveState();
      updateRecentCombo(combo.key);
      ui.screen = "workspace";
      ui.accountMenuOpen = false;
      ui.searchKeyword = "";
      ui.filterStatus = "";
      ui.filterRoleId = "";
      ui.selectedTenantDetailTab = "basic";
      const initialPages = currentNavPages();
      ui.currentPage = initialPages[0]?.key || "";
      ui.selectedNodeId = rootNode(tenant.id)?.id || "";
      render();
    }

    function logout() {
      state.session = null;
      saveState();
      ui.screen = "login";
      ui.loginPhone = "";
      ui.loginCode = "";
      ui.sentPhone = "";
      ui.modal = null;
      ui.accountMenuOpen = false;
      render();
    }

    function currentPageAccess() {
      const member = currentMember();
      const tenant = currentTenant();
      if (!member || !tenant) return [];
      const pages = state.session?.pageAccessSnapshot;
      if (pages) {
        if (currentPlatform() === "cms") return pages.cms || [];
        if (currentPlatform() === "fde") return pages[currentFdeModule()] || [];
        return pages.enterprise || [];
      }
      if (currentPlatform() === "cms") return memberPageAccess(member, tenant, "cms");
      if (currentPlatform() === "fde") return memberPageAccess(member, tenant, currentFdeModule());
      return memberPageAccess(member, tenant, "enterprise");
    }

    function normalizedPlatformPages(platformKey) {
      const member = currentMember();
      const tenant = currentTenant();
      if (!member || !tenant) return [];
      const access = state.session?.pageAccessSnapshot || {
        cms: memberPageAccess(member, tenant, "cms"),
        fdeBusiness: memberPageAccess(member, tenant, "fdeBusiness"),
        fdeDev: memberPageAccess(member, tenant, "fdeDev"),
        enterprise: memberPageAccess(member, tenant, "enterprise"),
      };

      if (platformKey === "cms") {
        if (isOperatorAdmin(member)) return ["cmsHome", "tenantList"];
        if (isTenantAdmin(member)) return ["cmsHome", "tenantList", "orgMembers", "roles"];
        if ((access.cms || []).includes("tenantList")) return ["cmsHome", "tenantList"];
        return (access.cms || []).includes("cmsHome") ? ["cmsHome"] : [];
      }

      if (platformKey === "fdeBusiness") {
        if (isTenantAdmin(member)) return ["fdeBusinessHome", "childTenants", "orgMembers", "roles"];
        const hasFdeAccess = (access.fdeBusiness || []).length || (access.fdeDev || []).length;
        return hasFdeAccess ? ["fdeBusinessHome", "childTenants"] : [];
      }

      if (platformKey === "fdeDev") {
        if (isTenantAdmin(member)) return ["fdeDevHome", "orgMembers", "roles"];
        const hasFdeAccess = (access.fdeBusiness || []).length || (access.fdeDev || []).length;
        return hasFdeAccess ? ["fdeDevHome"] : [];
      }

      if (platformKey === "enterprise") {
        if (isTenantAdmin(member)) return ["enterpriseHome", "orgMembers", "roles"];
        return (access.enterprise || []).length ? ["enterpriseHome"] : [];
      }

      return [];
    }

    function currentNavPages() {
      const platform = currentPlatform();
      if (platform === "cms") {
        return MODULE_DEFS.cms.filter((item) => normalizedPlatformPages("cms").includes(item.key));
      }
      if (platform === "fde") {
        return MODULE_DEFS[currentFdeModule()].filter((item) => normalizedPlatformPages(currentFdeModule()).includes(item.key));
      }
      return MODULE_DEFS.enterprise.filter((item) => normalizedPlatformPages("enterprise").includes(item.key));
    }

    function currentSidebarPages() {
      return currentNavPages().filter((item) => !["orgMembers", "roles"].includes(item.key));
    }

    function currentPlatformChoices() {
      const member = currentMember();
      const tenant = currentTenant();
      if (!member || !tenant) return [];
      const access = sessionPlatformAccess();
      const choices = [];
      if (access.cms) {
        choices.push({ platform: "cms", label: PLATFORM_LABELS.cms, sublabel: "" });
      }
      if (access.fdeBusiness || access.fdeDev) {
        choices.push({
          platform: "fde",
          label: PLATFORM_LABELS.fde,
          sublabel: [access.fdeBusiness ? "业务" : "", access.fdeDev ? "开发" : ""].filter(Boolean).join(" / "),
        });
      }
      if (access.enterprise) {
        choices.push({ platform: "enterprise", label: PLATFORM_LABELS.enterprise, sublabel: "" });
      }
      return choices;
    }

    function currentFdeNavGroups() {
      const member = currentMember();
      if (!member) return [];
      return [
        {
          module: "fdeBusiness",
          label: "FDE业务",
          items: MODULE_DEFS.fdeBusiness.filter((item) => normalizedPlatformPages("fdeBusiness").includes(item.key)),
        },
        {
          module: "fdeDev",
          label: "FDE开发",
          items: MODULE_DEFS.fdeDev.filter((item) => normalizedPlatformPages("fdeDev").includes(item.key)),
        },
      ].filter((group) => group.items.length);
    }

    function currentScopeMemberIds() {
      const member = currentMember();
      const tenant = currentTenant();
      if (!member || !tenant) return [];
      if (isTenantAdmin(member) || isOperatorAdmin(member)) return membersByTenant(tenant.id).map((item) => item.id);
      const leaderNodeIds = nodesByTenant(tenant.id)
        .filter((node) => node.leaderMemberId === member.id)
        .map((node) => node.id);
      if (leaderNodeIds.length) {
        const scopedNodeIds = Array.from(new Set(leaderNodeIds.flatMap((nodeId) => descendants(nodeId))));
        return membersByTenant(tenant.id)
          .filter((item) => item.orgIds.some((orgId) => scopedNodeIds.includes(orgId)))
          .map((item) => item.id);
      }
      return [member.id];
    }

    function visibleMembersForSelectedNode() {
      const tenant = currentTenant();
      const selectedNodeId = ui.selectedNodeId || rootNode(tenant.id)?.id || "";
      const scopedIds = new Set(currentScopeMemberIds());
      const treeIds = selectedNodeId ? descendants(selectedNodeId) : [];
      return membersByTenant(tenant.id)
        .filter((item) => scopedIds.has(item.id))
        .filter((item) => !selectedNodeId || item.orgIds.some((orgId) => treeIds.includes(orgId)))
        .filter((item) => {
          const user = getUser(item.userId);
          if (ui.searchKeyword) {
            const text = [user.name, user.phone].join(" ");
            if (!text.includes(ui.searchKeyword)) return false;
          }
          if (ui.filterStatus && item.status !== ui.filterStatus) return false;
          if (ui.filterRoleId && !item.roleIds.includes(ui.filterRoleId)) return false;
          return true;
        });
    }

    function nodeTreeHtml(selectedId) {
      const tenant = currentTenant();
      const root = rootNode(tenant.id);
      const canManage = isTenantAdmin(currentMember()) || isOperatorAdmin(currentMember());
      if (!root) return `<div class="empty">暂无组织树</div>`;
      function walk(node) {
        const children = childrenOf(node.id);
        const leader = node.leaderMemberId ? memberName(node.leaderMemberId) : "未设置";
        return `
          <li>
            <div class="tree-node ${selectedId === node.id ? "active" : ""}" onclick="window.demo.selectNode('${node.id}')">
              <div class="tree-node-head">
                <div class="tree-node-title">
                  <span>${escapeHtml(node.name)}</span>
                </div>
                ${
                  canManage
                    ? `
                        <div class="tree-node-actions">
                          <button class="button small ghost" onclick="event.stopPropagation(); window.demo.createChildNode('${node.id}')">新建</button>
                          <button class="button small ghost" onclick="event.stopPropagation(); window.demo.openModal('node-edit','${node.id}')">编辑</button>
                          ${node.parentId ? `<button class="button small danger" onclick="event.stopPropagation(); window.demo.confirmDeleteNode('${node.id}')">删除</button>` : ""}
                        </div>
                      `
                    : ""
                }
              </div>
              <div class="tree-node-meta">负责人 ${escapeHtml(leader)}</div>
            </div>
            ${children.length ? `<ul>${children.map(walk).join("")}</ul>` : ""}
          </li>
        `;
      }
      return `<div class="tree-wrap"><ul class="org-tree">${walk(root)}</ul></div>`;
    }

        if (isOperatorAdmin(member)) return true;
        if (isTenantAdmin(member)) return item.id === current.id;

      });

    function renderNodeCheckboxTree(nodes, selectedIds, singleSelect = false) {
      const roots = nodes.filter((item) => !item.parentId);
      function walk(node) {
        const children = nodes.filter((item) => item.parentId === node.id);
        return `
          <li>
            <label class="toolbar">
              <input type="${singleSelect ? "radio" : "checkbox"}" name="orgIds" value="${node.id}" ${selectedIds.includes(node.id) ? "checked" : ""} />
              <span>${escapeHtml(node.name)}</span>
            </label>
            ${children.length ? `<ul>${children.map(walk).join("")}</ul>` : ""}
          </li>
        `;
      }
      return `<ul>${roots.map(walk).join("")}</ul>`;
    }

      submitTenantPermissions(event, tenantId) {
        event.preventDefault();
        const form = new FormData(event.target);
        const tenant = getTenant(tenantId);
        const nextPermissions = {
          platforms: { cms: false, fdeBusiness: false, fdeDev: false, enterprise: false },
          modules: { cms: [], fdeBusiness: [], fdeDev: [], enterprise: [] },
        };
        ["cms", "fdeBusiness", "fdeDev", "enterprise"].forEach((key) => {
          nextPermissions.platforms[key] = form.get(`platform_${key}`) === "on";
          nextPermissions.modules[key] = form.getAll(`module_${key}`).map(String);
          if (!nextPermissions.platforms[key]) nextPermissions.modules[key] = [];
        });
        const normalized = normalizeTenantPermissions(tenant, nextPermissions);
        const affected = countPermissionImpact(tenant, normalized);
        const reduced = ["cms", "fdeBusiness", "fdeDev", "enterprise"].some((key) => {
          if (tenant.permissions.platforms[key] && !normalized.platforms[key]) return true;
          return tenant.permissions.modules[key].some((item) => !normalized.modules[key].includes(item));
        });
        if (reduced) {
          ui.modal = {
            type: "confirm",
            payload: {
              title: "保存权限配置",
              message: `将影响 ${affected} 名成员的权限。当前会话不中断，下次登录失效，确认保存？`,
              confirmText: "确认保存",
              danger: true,
              action: "tenant-permissions-save",
              args: [tenantId, normalized, affected],
            },
          };
          renderModal();
          return;
        }
        window.demo.applyTenantPermissions(tenantId, normalized, affected);
      },
      applyTenantPermissions(tenantId, normalized, affected = 0) {
        const tenant = getTenant(tenantId);
        tenant.permissions = normalized;
        tenant.kind = tenant.parentId ? "child" : (normalized.platforms.fdeBusiness || normalized.modules.fdeBusiness.includes("childTenants") ? "top" : "single");
        saveState();
        ui.modal = null;
        render();
        showToast(affected ? `已保存，${affected} 名成员权限将于下次登录生效` : "已保存", "success");
      },
      submitTenantAdmins(event, tenantId) {
        event.preventDefault();
        const checked = new Set(new FormData(event.target).getAll("adminIds").map(String));
        const adminRole = rolesByTenant(tenantId).find((role) => role.builtInKey === "tenantAdmin");
        const draft = ui.modal?.payloadData || {};
        const createName = String(draft.createName || "").trim();
        const createPhone = String(draft.createPhone || "").trim();
        if (checked.size > 3) {
          showToast("最多 3 个", "error");
          return;
        }
        if ((createName && !createPhone) || (!createName && createPhone)) {
          showToast("请完整填写新建管理员信息", "error");
          return;
        }
        if (createName && createPhone) {
          let user = findUserByPhone(createPhone);
          if (!user) {
            user = { id: uid("user"), name: createName, phone: createPhone };
            state.users.push(user);
          } else {
            user.name = createName;
          }
          let member = membersByTenant(tenantId).find((item) => item.userId === user.id);
          if (!member) {
            member = {
              id: uid("member"),
              tenantId,
              userId: user.id,
              orgIds: [rootNode(tenantId)?.id].filter(Boolean),
              roleIds: [],
              status: "enabled",
              assetCount: 0,
            };
            state.members.push(member);
          }
          checked.add(member.id);
        }
        if (checked.size > 3) {
          showToast("最多 3 个", "error");
          return;
        }
        membersByTenant(tenantId).forEach((member) => {
          if (checked.has(member.id)) {
            if (!member.roleIds.includes(adminRole.id)) member.roleIds.unshift(adminRole.id);
          } else {
            member.roleIds = member.roleIds.filter((roleId) => roleId !== adminRole.id);
          }
        });
        saveState();
        ui.modal = null;
        render();
        showToast(checked.size ? "已保存，已短信通知租户管理员" : "已保存", "success");

        const form = new FormData(event.target);
        const name = String(form.get("name") || "").trim();
        const phone = String(form.get("phone") || "").trim();
        const orgIds = form.getAll("orgIds").map(String);
        const roleIds = form.getAll("roleIds").map(String).filter((roleId) => getRole(roleId)?.builtInKey !== "tenantAdmin");
        if (!name || !phone || !orgIds.length || !roleIds.length) {
          showToast("请填写完整信息", "error");
          return;
        }
        let user = findUserByPhone(phone);
        const isNewUser = !user;
        if (!user) {
          user = { id: uid("user"), name, phone };
          state.users.push(user);
        } else {
          user.name = name;
        }
        const tenantId = currentTenant().id;
        const seatsUsed = membersByTenant(tenantId).filter((item) => item.status !== "deleted").length;
        if (!memberId && isNewUser && seatsUsed >= currentTenant().seats) {
          showToast("席位已满", "error");
          return;
        }
        const existsInTenant = membersByTenant(tenantId).find((item) => item.userId === user.id && item.id !== memberId);
        if (existsInTenant) {
          showToast("该手机号已注册，请确认", "error");
          return;
        }
        if (memberId) {
          const member = getMember(memberId);
          member.userId = user.id;
          member.orgIds = orgIds;
          member.roleIds = roleIds;
        } else {
          state.members.push({
            id: uid("member"),
            tenantId,
            userId: user.id,
            orgIds,
            roleIds,
            status: "enabled",
            assetCount: 0,
          });
        }
        saveState();
        ui.modal = null;
        render();
        showToast(memberId ? "已保存" : "已创建，已短信通知成员", "success");
      },
      toggleMemberStatus(memberId, nextStatus) {
        ui.modal = {
          type: "confirm",
          payload: {
            title: nextStatus === "enabled" ? "启用成员" : "停用成员",
            message: `确认${nextStatus === "enabled" ? "启用" : "停用"} ${memberName(memberId)}？`,
            confirmText: nextStatus === "enabled" ? "启用" : "停用",
            danger: nextStatus !== "enabled",
            action: "member-status",
            args: [memberId, nextStatus],
          },
        };
        renderModal();
      },
      applyMemberStatus(memberId, nextStatus) {
        const member = getMember(memberId);
        member.status = nextStatus;
        saveState();
        render();
        showToast(nextStatus === "enabled" ? "已启用" : "已停用", "success");
      },
      setLeader(nodeId, memberId) {
        const node = getNode(nodeId);
        if (node.leaderMemberId && node.leaderMemberId !== memberId) {
          showToast("需先解除当前负责人", "error");
          return;
        }
        node.leaderMemberId = memberId;
        saveState();
        render();
        showToast("已设置", "success");
      },
      unsetLeader(nodeId) {
        const node = getNode(nodeId);
        node.leaderMemberId = "";
        saveState();
        render();
        showToast("已解除", "success");
      },
      deleteMember(memberId) {
        const member = getMember(memberId);
        if (member.assetCount > 0) {
          ui.modal = { type: "member-transfer", payload: memberId };
          renderModal();
          return;
        }
        ui.modal = {
          type: "confirm",
          payload: {
            title: "删除成员",
            message: `确认删除 ${memberName(memberId)}？`,
            confirmText: "删除",
            danger: true,
            action: "member-delete",
            args: [memberId],
          },
        };
        renderModal();
      },
      applyMemberDelete(memberId) {
        const member = getMember(memberId);
        member.status = "deleted";
        saveState();
        render();
        showToast("已删除", "success");
      },
      submitMemberTransfer(event, memberId) {
        event.preventDefault();
        const targetId = String(new FormData(event.target).get("targetId") || "").trim();
        const member = getMember(memberId);
        const target = getMember(targetId);
        if (!target) {
          showToast("请选择转移目标", "error");
          return;
        }
        target.assetCount += member.assetCount;
        member.assetCount = 0;
        member.status = "deleted";
        saveState();
        ui.modal = null;
        render();
        showToast("已转移并删除", "success");
      },
      submitRole(event, roleId) {
        event.preventDefault();
        const form = new FormData(event.target);
        const editing = roleId ? getRole(roleId) : null;
        if (editing?.builtInKey === "tenantAdmin") {
          showToast("租户管理员是系统角色，不可编辑", "error");
          return;
        }
        const name = String(form.get("name") || editing?.name || "").trim();
        const nextPages = { cms: [], fdeBusiness: [], fdeDev: [], enterprise: [] };
        ["cms", "fdeBusiness", "fdeDev", "enterprise"].forEach((key) => {
          nextPages[key] = form.getAll(`page_${key}`).map(String);
        });
        if (!name) {
          showToast("请输入角色名称", "error");
          return;
        }
        if (editing) {
          editing.name = name;
          editing.pages = nextPages;
        } else {
          state.roles.push({
            id: uid("role"),
            tenantId: currentTenant().id,
            name,
            type: "custom",
            builtInKey: "",
            pages: nextPages,
          });
        }
        saveState();
        ui.modal = null;
        render();
        showToast("已保存", "success");
      },
      deleteRole(roleId) {
        const role = getRole(roleId);
        if (!role || role.type !== "custom") return;
        if (roleCount(roleId)) {
          showToast("该角色仍有关联成员，无法删除", "error");
          return;
        }
        ui.modal = {
          type: "confirm",
          payload: {
            title: "删除角色",
            message: `${role.name} 已关联 ${roleCount(roleId)} 个成员，删除后这些成员将失去对应权限，确认删除？`,
            confirmText: "删除",
            danger: true,
            action: "role-delete",
            args: [roleId],
          },
        };
        renderModal();
      },
      applyRoleDelete(roleId) {
        const role = getRole(roleId);
        if (!role || role.type !== "custom") return;
        state.members.forEach((member) => {
          member.roleIds = member.roleIds.filter((item) => item !== roleId);
        });
        state.roles = state.roles.filter((item) => item.id !== roleId);
        saveState();
        render();
        showToast("已删除", "success");
      },
    };

    render();
  </script>
</body>
</html>
