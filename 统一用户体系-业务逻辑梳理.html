<head>

  <title>统一用户体系业务流程图 V1.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #eef1f6; color: #0f172a;
    }
    .page-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 60%, #1e40af 100%);
      color: white; padding: 16px 32px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 3px 16px rgba(0,0,0,0.35); position: sticky; top: 0; z-index: 100;
    }
    .page-header h1 { font-size: 20px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
    .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: #60a5fa; box-shadow: 0 0 8px #60a5fa; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .version-badge { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); padding: 3px 12px; border-radius: 99px; font-size: 11px; color: #93c5fd; font-weight: 700; }
    .hint-badge { font-size: 11px; color: #fbbf24; }
    .main-content { padding: 16px 20px 28px; }
    .legend-box {
      background: white; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      padding: 12px 18px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center;
    }
    .legend-section { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .legend-divider { width: 1px; height: 24px; background: #e2e8f0; }
    .legend-title { font-size: 10px; font-weight: 800; color: #374151; text-transform: uppercase; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #4b5563; }
    .legend-dot { width: 20px; height: 12px; border-radius: 3px; }
    .legend-diamond { width: 10px; height: 10px; transform: rotate(45deg); border-radius: 1px; }
    .scroll-wrap { overflow: auto; border-radius: 12px; box-shadow: 0 4px 28px rgba(0,0,0,0.13); background: #fff; }
    svg text { user-select: none; }
  </style>
</head>

        <text x="390" y="988" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">规则1：User ≠ Member</text>
        <text x="390" y="1008" text-anchor="middle" font-size="11" fill="#c2410c">User 是全局账号；Member 是租户内身份实例</text>
        <text x="390" y="1026" text-anchor="middle" font-size="11" fill="#c2410c">统一用户体系的根就是这层拆分</text>

        <g filter="url(#sh)"><rect x="650" y="960" width="340" height="84" rx="14" fill="#fff1ea" stroke="#fdba74" stroke-width="2"></rect></g>
        <text x="820" y="988" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">规则2：父子租户有约束</text>
        <text x="820" y="1008" text-anchor="middle" font-size="11" fill="#c2410c">父租户未开平台/模块，子租户不能开</text>
        <text x="820" y="1026" text-anchor="middle" font-size="11" fill="#c2410c">子租户能力不能超过父租户</text>

        <g filter="url(#sh)"><rect x="1080" y="960" width="340" height="84" rx="14" fill="#fff1ea" stroke="#fdba74" stroke-width="2"></rect></g>
        <text x="1250" y="988" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">规则3：权限分三层</text>
        <text x="1250" y="1008" text-anchor="middle" font-size="11" fill="#c2410c">平台权限 / 页面权限 / 数据范围权限</text>
        <text x="1250" y="1026" text-anchor="middle" font-size="11" fill="#c2410c">不能全揉成角色权限一层</text>

        <g filter="url(#sh)"><rect x="1510" y="960" width="420" height="84" rx="14" fill="#fff1ea" stroke="#fdba74" stroke-width="2"></rect></g>
        <text x="1720" y="988" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">规则4：登录后要先选“身份组合”</text>
        <text x="1720" y="1008" text-anchor="middle" font-size="11" fill="#c2410c">组合维度 = 租户 × 平台 × 成员身份</text>
        <text x="1720" y="1026" text-anchor="middle" font-size="11" fill="#c2410c">不是直接跳某个后台首页</text>
      </svg>
    </div>
  </div>
