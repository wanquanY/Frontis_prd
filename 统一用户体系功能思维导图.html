# 统一用户体系功能思维导图

## 一、通用登录与身份切换

### 手机号登录
- 涉及角色
  - 平台运营人员
  - FDE 团队负责人
  - FDE 工程师
  - 企业管理员
  - 企业员工
- 用户旅程
  - 所有用户通过手机号和验证码登录，期望用一个账号进入 Frontis 的不同系统而不用重复注册。

### 获取验证码
- 涉及角色
  - 平台运营人员
  - FDE 团队负责人
  - FDE 工程师
  - 企业管理员
  - 企业员工
- 用户旅程
  - 所有用户获取验证码，期望低门槛完成登录，同时平台能控制验证码发送频率。

### 登录失败限制
- 涉及角色
  - 平台运营人员
  - FDE 团队负责人
  - FDE 工程师
  - 企业管理员
  - 企业员工
- 用户旅程
  - 所有用户在连续失败时被限制登录尝试，期望账号安全得到保护。

### 身份组合选择
- 涉及角色
  - 平台运营人员
  - FDE 团队负责人
  - FDE 工程师
  - 企业管理员
  - 企业员工
- 用户旅程
  - 多身份用户登录后选择当前要进入的租户、平台和身份，期望快速进入正确的工作上下文。

### 最近使用组合快捷进入
- 涉及角色
  - 高频切换租户/平台的 FDE 团队负责人
  - 跨租户服务的 FDE 工程师
  - 多平台管理的运营人员
- 用户旅程
  - 高频用户通过最近使用组合快速进入常用后台，期望减少重复选择成本。

### 会话快照生成
- 涉及角色
  - 所有登录用户
- 用户旅程
  - 用户进入本次会话时生成权限快照，期望当前会话内菜单和权限稳定生效，不因后台变更而混乱。

## 二、运营管理后台

### 租户管理
#### 创建租户
- 涉及角色
  - 平台运营人员
- 用户旅程
  - 平台运营人员创建租户，期望快速承接新的客户主体或内部业务主体。

#### 编辑租户信息
- 涉及角色
  - 平台运营人员
- 用户旅程
  - 平台运营人员维护租户资料，期望租户信息与真实业务主体保持一致。

#### 父子租户管理
- 涉及角色
  - 平台运营人员
- 用户旅程
  - 平台运营人员维护顶级租户和子租户关系，期望集团型客户的层级关系清晰可控。

#### 关联 FDE 负责人
- 涉及角色
  - 平台运营人员
  - FDE 团队负责人
- 用户旅程
  - 平台运营人员给租户绑定 FDE 负责人，期望后续业务承接和责任归属明确。

### 租户能力开通
#### 开通平台权限
- 涉及角色
  - 平台运营人员
- 用户旅程
  - 平台运营人员为租户开通运营/FDE/企业平台能力，期望不同租户只进入被授权的系统。

#### 开通模块权限
- 涉及角色
  - 平台运营人员
- 用户旅程
  - 平台运营人员给租户配置模块级能力，期望客户只看到购买或授权的功能。

#### 父子租户能力约束
- 涉及角色
  - 平台运营人员
- 用户旅程
  - 平台运营人员维护父子租户能力边界，期望子租户能力不能超过父租户。

### 组织与成员管理
#### 查看全租户成员
- 涉及角色
  - 平台运营人员
- 用户旅程
  - 平台运营人员查看租户成员情况，期望快速掌握各租户账号和人员分布。

#### 维护平台侧成员
- 涉及角色
  - 平台运营人员
- 用户旅程
  - 平台运营人员调整平台内部成员状态和角色，期望内部运营团队协作清晰。

### 角色与权限管理
#### 预设角色维护
- 涉及角色
  - 平台运营人员
- 用户旅程
  - 平台运营人员维护预设角色，期望标准角色能覆盖典型岗位场景。

#### 自定义角色维护
- 涉及角色
  - 平台运营人员
- 用户旅程
  - 平台运营人员创建或调整自定义角色，期望适配特殊业务分工。

#### 平台权限配置
- 涉及角色
  - 平台运营人员
- 用户旅程
  - 平台运营人员配置角色的平台进入权限，期望不同角色只进入对应后台。

#### 页面权限配置
- 涉及角色
  - 平台运营人员
- 用户旅程
  - 平台运营人员配置页面权限，期望角色进入平台后只看到对应菜单。

---

## 三、FDE业务管理

### 租户管理
#### 查看负责租户
- 涉及角色
  - FDE 团队负责人
  - FDE 工程师
- 用户旅程
  - FDE 团队负责人和工程师查看自己负责的租户，期望快速识别承接范围和责任边界。

#### 维护租户基础信息
- 涉及角色
  - FDE 团队负责人
  - FDE 工程师
- 用户旅程
  - FDE 团队在业务推进过程中维护租户信息，期望业务执行信息与客户状态一致。

### 组织树管理
#### 查看组织树
- 涉及角色
  - FDE 团队负责人
  - FDE 工程师
- 用户旅程
  - FDE 团队查看组织树，期望按真实团队结构理解人员分布和职责层级。

#### 创建/编辑组织节点
- 涉及角色
  - FDE 团队负责人
- 用户旅程
  - FDE 团队负责人维护组织节点，期望后续业务分派和管理链路有明确结构。

#### 设置组织负责人
- 涉及角色
  - FDE 团队负责人
- 用户旅程
  - FDE 团队负责人设置小组负责人，期望团队管理责任和业务责任清晰对应。

### 成员管理
#### 查看成员归属
- 涉及角色
  - FDE 团队负责人
  - FDE 工程师
- 用户旅程
  - FDE 团队查看成员归属，期望知道谁属于哪个组、能承接什么业务。

#### 新增/编辑成员
- 涉及角色
  - FDE 团队负责人
- 用户旅程
  - FDE 团队负责人维护成员信息，期望随着人员变化及时调整系统内分工。

#### 启停成员
- 涉及角色
  - FDE 团队负责人
- 用户旅程
  - FDE 团队负责人启停成员，期望无效或离岗成员及时失去系统权限。

### 商机分配相关
#### 按组织分配商机
- 涉及角色
  - FDE 团队负责人
  - FDE 工程师
- 用户旅程
  - FDE 团队负责人根据组织树把商机分配到对应小组，期望商机流转有组织依据、责任明确。

#### 按成员分配商机
- 涉及角色
  - FDE 团队负责人
  - FDE 工程师
- 用户旅程
  - FDE 团队负责人把具体商机分给具体工程师，期望一线跟进责任到人。

### 角色与权限管理
#### 给成员分配角色
- 涉及角色
  - FDE 团队负责人
  - FDE 工程师
- 用户旅程
  - FDE 团队负责人给成员分配业务角色，期望成员进入系统后只看到自己负责的业务入口。

#### 数据范围控制
- 涉及角色
  - FDE 团队负责人
  - FDE 工程师
- 用户旅程
  - 系统根据角色与组织控制数据范围，期望工程师只看到自己负责的租户和业务对象。

---

## 四、FDE开发管理

### 身份进入
#### 进入 FDE 开发平台
- 涉及角色
  - FDE 开发人员
  - 同时具备开发身份的 FDE 工程师
- 用户旅程
  - FDE 开发人员进入开发平台，期望快速进入研发协作上下文。

#### FDE 业务 / 开发身份切换
- 涉及角色
  - 同时承担业务和开发职责的成员
- 用户旅程
  - 同一用户在业务和开发身份之间切换，期望一个账号支持多岗位协同工作。

### Agent 开发与发布
#### 创建 Agent
- 涉及角色
  - FDE 开发人员
- 用户旅程
  - FDE 开发人员创建 Agent，期望把业务需求转化为可运行的智能体能力。

#### 测试 Agent
- 涉及角色
  - FDE 开发人员
- 用户旅程
  - FDE 开发人员测试 Agent，期望在提交前验证能力、稳定性和可用性。

#### 提交上架审核
- 涉及角色
  - FDE 开发人员
  - 平台运营人员
- 用户旅程
  - FDE 开发人员提交 Agent 上架审核，期望通过运营审核后进入 Agent Store。

#### 发布到 Agent Store
- 涉及角色
  - 平台运营人员
  - FDE 开发人员
- 用户旅程
  - 运营审核通过后将 Agent 发布到 Agent Store，期望该技术能力进入平台技术资产池。

### Agent 版本管理与进化
#### 提交新版本
- 涉及角色
  - FDE 开发人员
- 用户旅程
  - FDE 开发人员提交新版本，期望持续优化已上线 Agent 的能力表现。

#### 管理版本历史
- 涉及角色
  - FDE 开发人员
- 用户旅程
  - FDE 开发人员查看版本历史，期望清楚掌握 Agent 的迭代轨迹和变更内容。

#### 处理驳回后重提
- 涉及角色
  - FDE 开发人员
  - 平台运营人员
- 用户旅程
  - FDE 开发人员根据审核驳回意见修改并重提，期望版本可以重新进入上线流程。

### 权限承载
#### 开发模块页面权限
- 涉及角色
  - FDE 开发人员
- 用户旅程
  - 系统根据开发身份开放开发相关页面，期望开发成员只看到与开发、发布、版本进化相关的功能。
---

## 五、企业管理后台

### 租户内组织管理
#### 查看企业组织树
- 涉及角色
  - 企业管理员
  - 企业员工（只读视情况）
- 用户旅程
  - 企业管理员查看企业组织树，期望系统结构与企业真实部门结构一致。

#### 创建/编辑组织节点
- 涉及角色
  - 企业管理员
- 用户旅程
  - 企业管理员维护组织结构，期望成员归属、权限分发和管理链路更清晰。

#### 设置组织负责人
- 涉及角色
  - 企业管理员
- 用户旅程
  - 企业管理员设置部门负责人，期望企业内部管理责任归属清楚。

### 企业成员管理
#### 新增企业成员
- 涉及角色
  - 企业管理员
  - 企业员工（被邀请对象）
- 用户旅程
  - 企业管理员新增成员并发起邀请，期望新员工激活后直接进入正确组织和权限范围。

#### 编辑企业成员
- 涉及角色
  - 企业管理员
- 用户旅程
  - 企业管理员调整企业成员信息，期望成员状态和组织归属始终与真实情况一致。

#### 启停企业成员
- 涉及角色
  - 企业管理员
- 用户旅程
  - 企业管理员停用或恢复成员，期望权限随着人员状态即时生效。

### 企业角色管理
#### 分配企业角色
- 涉及角色
  - 企业管理员
  - 企业员工
- 用户旅程
  - 企业管理员给员工分配角色，期望不同岗位进入系统后看到不同的能力入口。

#### 自定义企业角色
- 涉及角色
  - 企业管理员
- 用户旅程
  - 企业管理员创建企业自定义角色，期望适配内部特殊岗位和权限需求。

### 企业权限配置
#### 配置平台权限
- 涉及角色
  - 企业管理员
  - 企业员工
- 用户旅程
  - 企业管理员控制员工能否进入企业平台，期望普通员工只进入企业侧工作空间。

#### 配置页面权限
- 涉及角色
  - 企业管理员
  - 企业员工
- 用户旅程
  - 企业管理员配置页面权限，期望员工进入后台后只看到与岗位相关的菜单。

#### 配置数据范围权限
- 涉及角色
  - 企业管理员
  - 企业员工
- 用户旅程
  - 企业管理员控制员工的数据可见范围，期望不同层级只看到自己应该看到的数据。

---

## 六、通用审计与安全

### 操作审计
#### 记录成员创建
- 涉及角色
  - 平台运营人员
  - FDE 团队负责人
  - 企业管理员
- 用户旅程
  - 管理者创建成员后，期望后续可追溯是谁在什么时间创建了什么成员。

#### 记录角色调整
- 涉及角色
  - 平台运营人员
  - FDE 团队负责人
  - 企业管理员
- 用户旅程
  - 管理者调整角色后，期望系统保留变更历史，方便审计和追责。

#### 记录权限变更
- 涉及角色
  - 平台运营人员
  - FDE 团队负责人
  - 企业管理员
- 用户旅程
  - 管理者修改权限后，期望后续可以追踪谁改了什么权限。

#### 记录租户能力变更
- 涉及角色
  - 平台运营人员
- 用户旅程
  - 平台运营人员调整租户能力后，期望系统保留开通历史和变更记录。

### 安全控制
#### 验证码冷却
- 涉及角色
  - 所有登录用户
- 用户旅程
  - 系统控制验证码发送频率，期望登录体验可用同时兼顾安全。

#### 登录锁定
- 涉及角色
  - 所有登录用户
- 用户旅程
  - 系统在异常登录时锁定账号，期望统一账号安全得到保护。

#### 会话权限稳定
- 涉及角色
  - 所有登录用户
- 用户旅程
  - 用户进入会话后权限保持稳定，期望菜单和页面不会在当前会话里混乱变化。

---

## 七、需要尽快拍板的问题

### 同一 User 在同一租户中是否只允许一个 Member
- 涉及角色
  - 平台运营人员
  - 产品经理
  - 研发
- 用户旅程
  - 产品与研发确认身份模型边界，期望后续账号体系不会因为身份定义不清而反复返工。

### 多角色冲突时如何处理
- 涉及角色
  - 平台运营人员
  - FDE 团队负责人
  - 企业管理员
- 用户旅程
  - 管理者给同一成员分配多个角色时，期望系统明确最终权限如何生效。

### 数据范围权限如何分层
- 涉及角色
  - 平台运营人员
  - FDE 团队负责人
  - 企业管理员
  - 企业员工
- 用户旅程
  - 不同层级角色进入后台时，期望系统准确控制其能看到的数据范围。

### 邀请 / 激活是否纳入统一用户闭环
- 涉及角色
  - 平台运营人员
  - FDE 团队负责人
  - 企业管理员
  - 被邀请成员
- 用户旅程
  - 管理者邀请成员时，期望从邀请到激活再到进入租户的链路一次打通。
