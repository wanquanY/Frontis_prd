# 运营平台需要具备的功能

## 一、平台初始化与租户开通

### 创建租户
- 功能点
  - 创建组织/租户
  - 录入租户基础信息
  - 维护租户状态
- 用户故事旅程
  - 作为平台运营人员，我希望创建新的客户租户并录入基础资料，以便后续业务、订单、交付都能挂在正确租户下。

### 开通系统模块权限
- 功能点
  - 开通企业工作台
  - 开通 FDE业务管理
  - 开通 FDE开发管理
  - 开通运营端能力
- 用户故事旅程
  - 作为平台运营人员，我希望给租户开通对应系统模块权限，以便不同客户只获得被授权的系统能力。

### 租户业务信息录入
- 功能点
  - 企业名称
  - 行业
  - 联系人
  - 管理员信息
  - 备注
- 用户故事旅程
  - 作为平台运营人员，我希望维护租户业务信息，以便后续商机承接、交付和服务信息完整一致。

### 邀请租户管理员
- 功能点
  - 邀请企业管理员
  - 邀请 FDE业务管理员
  - 发送激活入口
- 用户故事旅程
  - 作为平台运营人员，我希望给租户发送管理员邀请，以便租户和 FDE 侧尽快进入对应后台开始工作。

---

## 二、Agent 审核与技术资产管理

### 审核 Agent 上架申请
- 功能点
  - 查看待审核 Agent
  - 查看描述/分类/版本说明
  - 审核通过
  - 审核拒绝
  - 填写驳回意见
- 用户故事旅程
  - 作为平台运营人员，我希望审核 FDE 提交的 Agent 上架申请，以便平台技术资产池中的 Agent 质量可控。

### 管理 Agent Store 上下架
- 功能点
  - 上架到 Agent Store
  - 下架 Agent
  - 控制可见范围
- 用户故事旅程
  - 作为平台运营人员，我希望控制 Agent 是否进入 Agent Store，以便技术资产池对内可管理、可筛选。

### 管理 Agent 版本
- 功能点
  - 查看版本历史
  - 查看版本说明
  - 审核新版本
  - 驳回版本
- 用户故事旅程
  - 作为平台运营人员，我希望审核和管理 Agent 版本，以便平台对技术资产迭代节奏保持控制。

---

## 三、商品中心与商业化配置

### 创建商品类目
- 功能点
  - 新增类目
  - 编辑类目
  - 停用类目
- 用户故事旅程
  - 作为平台运营人员，我希望维护商品类目，以便商品池的结构适配不同业务场景。

### Agent 转商品
- 功能点
  - 选择已上架 Agent
  - 填写商品名称
  - 配置商品描述
  - 配置定价
- 用户故事旅程
  - 作为平台运营人员，我希望把已上架 Agent 转成商品，以便技术资产可以被销售和交付。

### 创建非 Agent 商品
- 功能点
  - 创建设备商品
  - 创建资源包商品
  - 创建服务商品
- 用户故事旅程
  - 作为平台运营人员，我希望创建非 Agent 商品，以便商品池不仅能卖 Agent，也能卖设备、资源包和服务。

### 创建 SKU / 规格
- 功能点
  - 配置版本
  - 配置时长
  - 配置套餐明细
  - 配置价格
- 用户故事旅程
  - 作为平台运营人员，我希望给商品配置 SKU 和规格，以便 FDE 下单时能直接选择标准化商品清单。

### 商品上架发布
- 功能点
  - 商品上架
  - 商品下架
  - 商品状态维护
- 用户故事旅程
  - 作为平台运营人员，我希望控制商品是否在商品池中可售，以便销售供给和商品生命周期可管理。

### 商品价格与归档维护
- 功能点
  - 调价
  - 编辑商品信息
  - 商品归档
- 用户故事旅程
  - 作为平台运营人员，我希望维护商品价格和状态，以便商品池持续保持可售和可运营状态。

---

## 四、折扣与商务规则支持

### 折扣审批
- 功能点
  - 接收折扣申请
  - 审核折扣比例/金额
  - 审批通过
  - 审批拒绝
- 用户故事旅程
  - 作为平台运营人员，我希望审核 FDE 工程师发起的折扣申请，以便成交灵活性和利润边界都能被控制。

### 驳回后回流支持
- 功能点
  - 返回驳回意见
  - 保留原申请记录
- 用户故事旅程
  - 作为平台运营人员，我希望驳回折扣时给出明确意见，以便 FDE 工程师能继续和客户重新谈判。

---

## 五、付款确认与履约控制

### 确认付款状态
- 功能点
  - 查看付款凭证
  - 人工核验到账
  - 标记已付款
  - 驳回凭证
- 用户故事旅程
  - 作为平台运营人员，我希望审核客户付款状态，以便只有确认到账的订单才能进入正式交付流程。

### 付款异常回流
- 功能点
  - 驳回凭证
  - 通知 FDE业务管理重新上传
- 用户故事旅程
  - 作为平台运营人员，我希望驳回异常付款凭证，以便错误付款信息不会误推进交付。

---

## 六、版本升级与续费规则支持

### 审核新版本发布
- 功能点
  - 审核新版本
  - 拒绝并回流开发
- 用户故事旅程
  - 作为平台运营人员，我希望审核新版本发布，以便已购客户的升级节奏、质量和影响范围可控。

### 判断升级是否涉及收费/权益变更
- 功能点
  - 识别免费升级
  - 识别收费升级
  - 识别权益变化
- 用户故事旅程
  - 作为平台运营人员，我希望区分免费升级和收费升级，以便决定是直接推送还是回流续费订单链路。

### 支持免费升级直推
- 功能点
  - 标记免费升级
  - 允许通知升级
  - 允许自动升级
- 用户故事旅程
  - 作为平台运营人员，我希望对合同内或免费升级直接推送，以便客户能更快获得新版本能力。

### 支持收费升级回订单
- 功能点
  - 标记收费升级
  - 回流续费/增购订单
- 用户故事旅程
  - 作为平台运营人员，我希望对涉及收费或权益变更的升级回到订单链路，以便商业规则和履约逻辑一致。

---

## 七、统一用户相关治理能力

### 租户能力与角色选择范围联动
- 功能点
  - 模块开通结果影响角色可选范围
  - 限制未开模块角色不可选
- 用户故事旅程
  - 作为平台运营人员，我希望租户开通模块后系统自动限制角色可选范围，以便角色分配不出现越权。

### 内置角色治理
- 功能点
  - 查看内置角色清单
  - 查看内置角色权限
  - 校验角色与模块绑定关系
- 用户故事旅程
  - 作为平台运营人员，我希望清楚看到内置角色和模块绑定关系，以便租户开通与角色授权规则一致。

### 自定义角色边界控制
- 功能点
  - 自定义角色仅在已开模块范围内配置权限
  - 校验页面权限越界
- 用户故事旅程
  - 作为平台运营人员，我希望限制自定义角色权限边界，以便租户自定义角色不会越过已开模块范围。

---

## 八、平台级审计与风险控制

### 关键配置留痕
- 功能点
  - 租户创建留痕
  - 模块开通留痕
  - 角色变更留痕
  - Agent 审核留痕
  - 付款确认留痕
- 用户故事旅程
  - 作为平台运营人员，我希望关键配置和审核动作都留痕，以便后续可以追溯责任和排查问题。

### 权限影响提示
- 功能点
  - 变更模块权限时提示影响范围
  - 变更角色时提示影响成员
- 用户故事旅程
  - 作为平台运营人员，我希望修改租户模块或角色权限时系统提示影响范围，以便避免误操作影响客户使用。

---

## 九、运营平台的核心价值总结

### 统一治理
- 用户故事旅程
  - 作为平台运营人员，我希望运营平台统一承接租户、Agent、商品、付款、角色和模块规则，以便整个平台业务闭环可控。

### 商业化控制
- 用户故事旅程
  - 作为平台运营人员，我希望平台侧控制商品、折扣、收费升级规则，以便商业策略统一执行。

### 履约准入控制
- 用户故事旅程
  - 作为平台运营人员，我希望付款确认和版本审核都由平台统一把关，以便不合规订单或不成熟版本不会流入客户侧。
